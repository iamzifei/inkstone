title: Inkstone 墨砚 — AI 知识库，Mac、iPhone 与 iPad
description: 会自己整理的 AI 知识库：把笔记、PDF、照片、录音拖进一个文件夹，Inkstone 按你的规则、用本机 AI 自动归档，并自动维护 AGENTS.md。免费。
