title: Inkstone墨砚 —— 一个把笔记留成文件的macOS / iOS应用
description: 纯Markdown文件，存在你自己选的文件夹里。双链、反向链接、关系图谱、白板和日记， 原生SwiftUI，为macOS 26与iOS 26而写。没有数据库，没有Electron，不需要注册。
