title: Inkstone墨硯 —— 一個把筆記留成檔案的macOS / iOS應用程式
description: 純Markdown檔案，放在你自己選的資料夾裡。雙向連結、反向連結、關聯圖譜、白板與日記， 原生SwiftUI，為macOS 26與iOS 26而寫。沒有資料庫，沒有Electron，不必註冊。
