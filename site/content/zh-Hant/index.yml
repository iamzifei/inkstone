title: Inkstone 墨硯 — AI 知識庫，Mac、iPhone 與 iPad
description: 會自己整理的 AI 知識庫：把筆記、PDF、照片、錄音拖進一個資料夾，Inkstone 依你的規則、用本機 AI 自動歸檔，並自動維護 AGENTS.md。免費。
