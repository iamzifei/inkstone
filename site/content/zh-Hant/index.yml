hero:
  eyebrow: macOS 26 · iOS 26 · 原生SwiftUI
  title: 筆記本來就是檔案，它就該一直是檔案。
  lede: Inkstone直接讀寫你指定資料夾裡的Markdown。它能打開你現有的儲存庫， 不會寫下任何別的編輯器打不開的東西，自己的狀態則放在一個隱藏資料夾裡， 你隨時可以刪掉。
  note: 免費 · Apple晶片 · English · 简体中文 · 繁體中文
  video_alt: Inkstone在macOS上的螢幕錄影：打開一個儲存庫、輸入一行中英混排的文字、 點開一個雙向連結、再打開關聯圖譜。
  video_caption: 錄於macOS 26。除了段落之間的淡入淡出，沒有別的剪接。
creed:
  title: 三個決定，其餘一切都是它們的結果
  sub: 它們是承重的。這個應用程式為什麼這樣表現，答案都在這裡。
  columns:
  - title: 檔案才是事實
    body: 沒有資料庫，沒有匯入步驟，沒有專有格式。Obsidian建的儲存庫在這裡能打開， 這裡建的儲存庫在那邊也能打開。就算Inkstone明天消失，你手上仍然是一個裝著Markdown的資料夾。
  - title: 斷掉的連結是永久的
    body: 既然沒有資料庫可以事後修，重新命名一篇筆記時，指向它的每一處雙向連結都會在同一個動作裡被改寫，涵蓋整個儲存庫。這是上一條的直接後果，不是外掛上去的功能。
  - title: 引擎不知道螢幕的存在
    body: 解析、索引、搜尋和圖譜都住在一個完全不import任何UI框架的套件裡。 所以它們由真正的測試涵蓋，而不是靠模擬器；也所以同一套引擎日後可以拿去撐起一個命令列工具。
features:
  title: 裡面有什麼
  sub: 下面每一條都已經實作並在跑，不是路線圖。
  items:
    live_preview:
      kicker: 編輯
      title: 即時預覽，而不是左右分割
      body: 標題、粗體、引用、callout、待辦、表格、程式碼區塊都隨打隨算繪， 只有游標所在的那一行會露出語法。閱讀模式是獨立的唯讀檢視， 想看沒有鷹架的成品時再切過去。內文字型、程式碼字型和各自的級數分開設定。
      alt: Inkstone的編輯器：標題、一段中英混排的內文、待辦清單、引用、callout、 對齊的表格和程式碼區塊，全部在原位算繪。
    links:
      kicker: 連結
      title: 雙向連結、別名、區塊引用、反向連結
      body: '[[筆記]]、[[筆記#標題]]、[[筆記^區塊]]、![[嵌入]]，以及在frontmatter裡宣告的別名，全部匯進同一個索引。每篇筆記都會顯示誰指向它、它指向誰， 以及它的哪些連結還沒有落點。'
      alt: 一篇筆記，右側欄列出它的反向連結與出向連結，下方是一張鄰居節點的區域圖譜。
    graph:
      kicker: 看清形狀
      title: 兩次打開，圖譜落在同一個地方
      body: 力導向模擬是決定性的，所以同一個儲存庫每次都畫出同一張圖。 你可以記住它的版面，而不是每次打開都重新辨認一遍。區域圖譜只看一篇筆記和它的鄰居。
      alt: 關聯圖譜檢視：筆記是節點，雙向連結是連線，引用越密集的越聚在一起。
    canvas:
      kicker: 空間化的筆記
      title: 白板，用的是開放的JSON Canvas格式
      body: 卡片、檔案和連線擺在一張無限大的紙上，存成JSON Canvas 1.0—— 和這個格式的其他實作讀寫的是同一個檔案。你的白板和你的筆記一樣可以帶走。
      alt: 一張白板：筆記卡片和它們之間的連線，在無限畫布上按空間關係擺放。
    search:
      kicker: 找東西
      title: 模糊切換器，以及支援運算子的搜尋
      body: '一個快速鍵喚起涵蓋整個儲存庫的模糊切換器。全文搜尋認得tag: 和path:； 標籤寫在行內或frontmatter裡都行，支援多層巢狀，也不挑文種—— #專案/進行中和 #project/active建索引的方式完全一樣。'
      alt: 快速切換器浮在筆記上方，隨著輸入逐字篩選整個儲存庫。
    sync:
      kicker: 兩台機器
      title: iCloud或GitHub，而且由你決定什麼跟著走
      body: 走iCloud同步，或者把整個儲存庫推到一個GitHub儲存庫——衝突會被解決一次， 而不是留下兩份副本。按檔案類型的開關決定附件和多媒體要不要跟著走， 儲存庫自己的 .gitignore會被尊重。
      alt: GitHub同步設定：儲存庫與分支選擇器，以及決定同步範圍的分檔案類型開關。
typography:
  title: 把中文和英文排在同一行裡
  sub: 難的是漢字句子裡嵌一個拉丁詞。幾乎所有應用程式都排錯，而且是那種看見一次就再也無法忽視的錯法。
  folio: 字樣 · Source Serif 4配思源宋體
  specimen_title: 中英文混排與那四分之一字寬
  specimen_lead: 中文是密排的。字與字之間沒有空格，所以一行是否勻淨，眼睛一看就知道。 往這樣一行裡丟進一個typography，兩種文字就撞在一起了。
  specimen_body: 內文裡出現Latin單字時，漢字與拉丁字母之間應當有一段約四分之一字寬的間隙——W3C的中文排版需求稱之為文字間隙。這一段文字本身就在示範它：每一處漢字與Latin的交界都由建置時插入的空元素撐開，在支援text-autospace的瀏覽器上則交還給瀏覽器處理，兩者永遠只生效一個。全形標點（，。；：）自帶二分空，因此一律不加。
  specimen_quote: 排版的存在是為了讓內容體面。它是僕人，而僕人的舉止應當讓人看不見。
  specimen_cite: Robert Bringhurst《字體排印風格要素》
  notes:
  - term: 行長
    def: 內文一行約66個字元，Bringhurst給出的單欄理想寬度。超過75， 眼睛就找不回下一行的行首了。
  - term: 同一個字族
    def: 拉丁用Source Serif 4，漢字用思源宋體——而思源宋體的拉丁伴隨字體正是 Source Serif。混排的那一行出自同一位設計師的襯線，不是兩套字在打架。
  - term: 顏色即語意
    def: 只有一種硃砂紅——印章壓在紙上的那種紅——用來標記連結、標籤和目前動作。 除此之外沒有任何東西是彩色的。
  - term: 動態效果是標點
    def: 元素出現時上移八個像素，此外什麼都不動。打開「減少動態效果」， 這一切一次都不會發生。
specs:
  title: 規格
  sub: 在你下載任何東西之前，值得先知道的部分。
  rows:
  - k: 平台
    v: macOS 26與iOS 26，一套SwiftUI程式碼，Apple晶片
  - k: 儲存
    v: 你自己選的資料夾裡的純Markdown檔案。沒有資料庫，不必匯入
  - k: 相容性
    v: Obsidian儲存庫原樣打開，雙向都行。白板是JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown，另加雙向連結、嵌入、區塊引用、callout、註腳、數學公式與Mermaid
  - k: 同步
    v: iCloud或GitHub儲存庫，可按檔案類型篩選
  - k: 介面語言
    v: English、简体中文、繁體中文
  - k: 原始碼
    v: 在GitHub上公開。尚未選定授權條款。
  - k: 隱私
    v: 不必帳號，沒有遙測，不會發起你沒要求過的網路請求
  closer: 它是免費的，它不扣著你的任何東西，而它寫下的檔案就是你本來就有的那些檔案。
