hero:
  eyebrow: Base de conocimiento con IA · Mac · iPhone · iPad
  title: Arrastra lo que sea. Se archiva solo.
  lede: 'Inkstone convierte una carpeta en una base de conocimiento con IA. Notas, PDF, fotos, grabaciones: cada archivo se ordena con reglas que puedes leer y cambiar, con una IA que funciona en tu dispositivo. Nunca se borra nada y cada ronda se puede deshacer.'
  note: Gratis · Sin cuenta · English · 简体中文 · 繁體中文
  mac_alt: 'Inkstone en un Mac: antes de archivar cinco archivos arrastrados, muestra el plan —archivados, privados, duplicados aparte— y espera a «Organize».'
  phone_alt: El mismo plan en el iPhone.
how:
  title: Una base de conocimiento en tres pasos
  sub: Nada que configurar. Un nombre, un lugar y algo que arrastrar.
  steps:
  - title: Ponle nombre y elige dónde vive
    body: iCloud Drive, cualquier carpeta o una que ya tengas. Inkstone crea las carpetas —bandeja de entrada, proyectos, áreas, recursos, medios, resultados, privado— y escribe las reglas de organización.
  - title: Arrastra lo que sea
    body: Arrastra archivos a la ventana o añádelos desde la app Archivos. La primera vez eliges copiar o mover; copiar es lo predeterminado. En iPhone y iPad, comparte desde cualquier app —Safari, Fotos, Archivos, Mail— y llega a la bandeja de entrada.
  - title: Se archiva por ti
    body: Lo que parece privado va primero a la carpeta privada; luego tus reglas, luego el modelo del dispositivo. Renombrado por fecha y tema. Lo dudoso espera en una carpeta de revisión.
  alts:
  - 'Paso 1: crea tu base de conocimiento con IA'
  - 'Paso 2: ¿copiar o mover?'
  - 'Paso 3: el plan —archivados, privados, duplicados aparte'
safe:
  title: No se pierde nada. Nunca.
  points:
  - Nunca se borra nada. Los duplicados van a una carpeta para borrar, que vacías tú.
  - Cada movimiento se anota antes de hacerse, en una tabla Markdown que puedes leer.
  - Deshacer devuelve toda una ronda, sin sobrescribir lo que cambiaste después.
  - ¿Más de 20 archivos o duplicados? Primero ves el plan completo y nada se mueve hasta que digas que sí.
  - 'El texto de una nota nunca se reescribe: solo se añaden arriba propiedades como su origen y la fecha.'
  alt: 'La base de conocimiento tras una ronda: carpetas en la barra lateral y un aviso —5 archivos organizados, Deshacer.'
ai:
  kicker: Gestión de contexto para IA
  title: Lista para la IA desde el primer archivo
  body: Cada base de conocimiento lleva tres archivos de entrada que Inkstone escribe y mantiene al día. Dale la carpeta a cualquier asistente o agente de IA y sabrá qué es, dónde está cada cosa y en qué archivo confiar.
  files:
  - name: AGENTS.md
    desc: qué es esto y las reglas que sigue un agente aquí
  - name: README.md
    desc: el mapa de carpetas, para personas y máquinas
  - name: SOURCE_OF_TRUTH.md
    desc: qué archivo manda para cada cosa
  foot: Solo se reescribe la parte entre las marcas de Inkstone. Lo que añadas alrededor se queda.
  alt: AGENTS.md abierto en Inkstone en un Mac.
rules:
  title: Tus reglas, en palabras sencillas
  body: Las reglas de organización son un archivo de tu base de conocimiento. Edítalas en Ajustes como una nota, una línea por regla. Van justo después de la comprobación de privacidad, antes que todo lo demás.
  example: '## My rules


    - Facturas → 20-Areas/Finance/Invoices

    - Reforma → 10-Projects/Renovation'
  foot: 'Debajo está la política predeterminada, en las mismas palabras sencillas: cámbiala o restáurala con un botón.'
  alt: Ajustes › Base de conocimiento en un Mac.
private:
  title: Privada por diseño
  cols:
  - title: IA en tu dispositivo
    body: El modelo de Apple en el dispositivo decide dónde va un archivo, en los dispositivos compatibles. Nada sale del dispositivo.
  - title: O tu propio modelo
    body: Desactivado por defecto. Con tu propia clave, se envía el nombre y el inicio de un archivo que las reglas no pueden colocar, junto con los nombres de tus carpetas y tus reglas; nunca un archivo que parezca privado.
  - title: Solo archivos
    body: Sin cuenta, sin analítica, sin servidor nuestro. Tu base de conocimiento es una carpeta de archivos normales.
features:
  title: También un editor Markdown completo
  sub: Todo es Markdown simple. Una bóveda de otra app Markdown se abre tal cual, y nunca se reorganiza.
  items:
    live_preview:
      kicker: Escribir
      title: Vista viva, no una pantalla partida
      body: 'Títulos, negritas, citas, avisos, casillas, tablas y código se componen sobre la marcha mientras escribes; la sintaxis solo se asoma en la línea donde está el cursor. El modo lectura es una vista aparte, de solo lectura. La letra del texto, la del código y sus cuerpos se ajustan por separado. En modo lectura los caracteres de sintaxis se eliminan en lugar de ocultarse: un párrafo copiado contiene solo el texto.'
      alt: 'El editor de Inkstone en vista viva: un título, un párrafo que mezcla chino y latín, una lista de tareas, una cita, un aviso, una tabla alineada y un bloque de código.'
    links:
      kicker: Enlazar
      title: Wikienlaces, alias, bloques, retroenlaces
      body: '[[Nota]], [[Nota#Título]], [[Nota^bloque]], ![[Incrustaciones]] y los alias declarados en el frontmatter se resuelven todos en un mismo índice. Cada nota muestra qué apunta a ella, a qué apunta, y cuáles de sus enlaces todavía no tienen destino.'
      alt: Una nota con sus retroenlaces y enlaces salientes en la barra lateral derecha, y debajo un pequeño grafo local de sus vecinas.
    graph:
      kicker: Ver la forma
      title: Un grafo que cae dos veces en el mismo sitio
      body: La simulación de fuerzas es determinista, así que una misma bóveda dibuja cada vez la misma imagen. Puedes aprenderte su disposición en lugar de releerla en cada apertura. El grafo local muestra una nota y sus vecinas.
      alt: 'La vista de grafo: las notas como nodos, unidas por sus wikienlaces y agrupadas según la densidad de sus referencias.'
    canvas:
      kicker: Notas en el espacio
      title: Lienzo, en el formato abierto JSON Canvas
      body: 'Tarjetas, archivos y conexiones sobre una hoja infinita, guardados como JSON Canvas 1.0: el mismo archivo que leen y escriben las demás implementaciones del formato. Tus lienzos son tan portátiles como tus notas.'
      alt: Un lienzo con tarjetas de notas y sus conexiones dispuestas espacialmente sobre una hoja infinita.
    search:
      kicker: Encontrar
      title: Selector difuso, y búsqueda con operadores
      body: 'Una tecla abre un selector difuso sobre todas las notas. La búsqueda de texto completo entiende tag: y path:, y las etiquetas funcionan en el cuerpo o en el frontmatter, anidadas, en cualquier escritura: #项目/进行中 se indexa exactamente igual que #project/active. Nada espera, ni en un vault de diez mil notas: la búsqueda corre fuera del hilo principal.'
      alt: El selector rápido abierto sobre una nota, filtrando la bóveda carácter a carácter.
    sync:
      kicker: Dos máquinas
      title: iCloud o GitHub, y tú decides qué viaja
      body: 'Sincroniza por iCloud, o empuja la bóveda a un repositorio de GitHub. Una vez que la bóveda se sincroniza, un conflicto nunca sobrescribe nada: si ambos lados cambiaron una nota, la otra versión se guarda junto a la tuya como copia en conflicto. Unos filtros por tipo de archivo deciden si los adjuntos y el material multimedia van con ella, y se respeta el .gitignore de la propia bóveda.'
      alt: 'Los ajustes de sincronización con GitHub: selectores de repositorio y rama, e interruptores por tipo de archivo.'
duo:
  title: 'iPhone Duo: una nota, cuatro formas'
  sub: 'Cerrado, es la app de iPhone. Abierto, la barra lateral y la nota quedan lado a lado. Entreabierto, la nota ocupa un lado del pliegue y sus vínculos de retorno, esquema y propiedades el otro: nada se dibuja sobre el pliegue.'
  video_alt: 'Una grabación de Inkstone en el iPhone Duo: la lista de notas en la pantalla exterior cerrada, la misma nota abierta junto a la barra lateral, después entreabierto como un libro con el inspector en la página derecha y, en vertical, con el inspector bajo el pliegue.'
  caption: Grabado en el simulador del iPhone Duo, iOS 27.2, y mostrado en los marcos de producto del iPhone Duo de Apple, en la postura de cada toma; la pantalla es la grabación, sin editar salvo los fundidos.
faq:
  title: Preguntas
  items:
  - q: ¿Qué es una base de conocimiento con IA?
    a: Una carpeta con tus notas y archivos, organizada para que tú y una IA encontréis las cosas, con archivos de entrada que le dicen a la IA dónde está cada cosa. En Inkstone sigue siendo una carpeta normal.
  - q: ¿Qué es la gestión de contexto para IA?
    a: Darle a un asistente de IA los archivos correctos y sus reglas. AGENTS.md y SOURCE_OF_TRUTH.md lo hacen para cualquier agente.
  - q: ¿Funciona con mi bóveda de Obsidian?
    a: Sí. Abierta como bóveda, se queda tal cual. Solo se organiza una base de conocimiento creada o adoptada por Inkstone.
  - q: ¿Qué dispositivos?
    a: Mac con macOS 26, iPhone y iPad con iOS 26. El modelo del dispositivo necesita Apple Intelligence; sin él, se organiza con tus reglas.
  - q: ¿Cuánto cuesta?
    a: Inkstone es gratis, en el Mac y en el App Store.
specs:
  title: Especificaciones
  sub: Lo que conviene saber antes de descargar nada.
  rows:
  - k: Base de conocimiento
    v: Bandeja de entrada, proyectos, áreas, recursos, medios, resultados, privado, revisión, archivo, con AGENTS.md, README.md y SOURCE_OF_TRUTH.md al día
  - k: Organización
    v: Primero la privacidad, luego tus reglas, luego el modelo de Apple en el dispositivo (o el tuyo, desactivado por defecto). Registrada, reversible, sin borrar nada
  - k: Plataformas
    v: 'macOS 26 e iOS 26, una sola base de código SwiftUI. La app de Mac es universal: Apple silicon e Intel'
  - k: Almacenamiento
    v: Archivos Markdown corrientes en una carpeta que eliges tú. Sin base de datos y sin importar nada
  - k: Compatibilidad
    v: Las bóvedas de Obsidian se abren tal cual, en ambos sentidos. El lienzo es JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown, más wikienlaces, incrustaciones, referencias de bloque, avisos, notas al pie, matemáticas y Mermaid
  - k: Sincronización
    v: iCloud o un repositorio de GitHub, con filtros por tipo de archivo
  - k: Flujo de trabajo
    v: Plantillas con los marcadores de Obsidian, exportar a PDF o HTML, paleta de comandos, notas en Spotlight, acciones de Atajos
  - k: Idiomas de la interfaz
    v: English, 简体中文, 繁體中文
  - k: Código
    v: Público en GitHub. Todavía no se ha elegido una licencia.
  - k: Privacidad
    v: Sin cuenta, sin telemetría, sin ninguna llamada de red que no hayas pedido
  closer: Es gratis, no te oculta nada y la base de conocimiento que crea es una carpeta que ya es tuya.
