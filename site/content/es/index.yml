title: Inkstone — una app de notas en Markdown para macOS e iOS
description: Archivos Markdown sin más, en tu propio disco. Wikienlaces, retroenlaces, un grafo, un lienzo y notas diarias, en una app nativa para macOS 26 e iOS 26. Sin base de datos, sin Electron, sin cuenta.
