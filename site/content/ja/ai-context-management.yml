title: AGENTS.md による AI コンテキスト管理 — Inkstone
description: AI アシスタントに正しいコンテキストを。Inkstone がナレッジベースの AGENTS.md、README.md、SOURCE_OF_TRUTH.md を最新に保ち、どのエージェントにも何がどこにあり、どのファイルを信頼すべきかを伝えます。
crumb: AI コンテキスト管理
h1: AI コンテキスト管理を、自動で最新に
lede: AI アシスタントの出来は、渡すファイルとその説明しだい。Inkstone はそのコンテキストをナレッジベースに書き込み、フォルダが変わるたびに書き直します。
hero_shot: mac-k3-agents
hero_alt: Mac の Inkstone で開いた AGENTS.md。
sections:
- h2: AI コンテキスト管理とは？
  paras:
  - コンテキストとは、AI モデルが答える前に見るもの、つまりファイルとその扱い方の指示です。管理するとは、アシスタントにどのファイルを読ませるか、フォルダの構成をどう伝えるか、2 つが食い違うときどちらを正とするかを決めることです。
  - 手で書いたコンテキストは 1 週間で古くなります。メモが移動し、フォルダの名前が変わると、アシスタントは自信満々に間違えます。
- h2: Inkstone が書く 3 つの入口ファイル
  list:
  - AGENTS.md：このナレッジベースが何か、そしてエージェントが守るルール。新しいファイルの行き先、何も削除しないこと、プライベートフォルダには触れないこと。
  - README.md：人にも機械にも読めるフォルダの地図。
  - SOURCE_OF_TRUTH.md：何についてどのファイルが正か。エージェントが 2 つの版のあいだで推測せずに済みます。
  paras:
  - AGENTS.md は、コーディングエージェントや AI アシスタントがフォルダの最上位で探す慣習のファイルです。Inkstone が書き直すのは自分のマーカーの間だけで、その外に書いた内容は残ります。
- h2: フォルダについていくコンテキスト
  paras:
  - 整理のたびに、Inkstone は入口ファイルを今あるフォルダに合わせて更新します。月曜に渡しても 3 か月後に渡しても、地図は最新です。
  shot: iphone-k3-agents
  alt: iPhone の AGENTS.md。
- h2: 初期設定でプライベート
  paras:
  - 整理に使うモデルはデバイス上で動きます。AGENTS.md はプライベートフォルダを立ち入り禁止と明記し、クラウドのモデルをオンにしていても、プライベートに見えるファイルは送りません。
faq:
  title: よくある質問
  items:
  - q: どの AI ツールが AGENTS.md を読みますか？
    a: フォルダの最上位にある普通の Markdown ファイルなので、フォルダを渡されたアシスタントやエージェントなら読めます。多くのコーディングエージェントは名前で探します。
  - q: AGENTS.md を自分で編集できますか？
    a: はい。Inkstone が書き直すのはマーカーの間だけです。その上や下に書いた指示は残ります。
  - q: AI による整理を使わなくても使えますか？
    a: はい。入口ファイルはナレッジベースの作成時に書かれ、ルールで振り分けてもモデルで振り分けても最新に保たれます。
