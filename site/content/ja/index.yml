title: Inkstone — Mac・iPhone・iPad のための AI ナレッジベース
description: 自分で整理される AI ナレッジベース。メモ、PDF、写真、録音をフォルダに入れるだけで、あなたのルールとデバイス上の AI で自動的に振り分けます。AGENTS.md も自動で作成。無料。
