hero:
  eyebrow: AI ナレッジベース · Mac · iPhone · iPad
  title: なんでも入れるだけ。自動で整理されます。
  lede: Inkstone はフォルダを AI ナレッジベースに変えます。メモ、PDF、写真、録音を、読めて書き換えられるルールと、デバイス上で動く AI で振り分けます。何も削除されず、すべての整理は取り消せます。
  note: 無料 · アカウント不要 · English · 简体中文 · 繁體中文
  mac_alt: Mac の Inkstone：入れた 5 つのファイルを振り分ける前に、整理プラン（振り分け、プライベート、重複は別に）を表示して確認を待つ画面。
  phone_alt: iPhone での同じプラン。
how:
  title: 3 ステップでナレッジベースに
  sub: 覚える設定はありません。名前と場所を決めて、入れるだけ。
  steps:
  - title: 名前と場所を決める
    body: iCloud Drive、任意のフォルダ、またはすでにあるフォルダ。受信箱、プロジェクト、エリア、資料、メディア、成果物、プライベートのフォルダと整理ルールを Inkstone が用意します。
  - title: なんでも入れる
    body: ウインドウにドラッグするか、「ファイル」アプリから追加。最初にコピーか移動かを選びます（初期設定はコピー）。
  - title: 自動で振り分け
    body: プライベートに見えるものはまずプライベートフォルダへ。次にあなたのルール、次にデバイス上のモデル。日付とテーマで名前を付け直し、判断に迷うものは確認用フォルダで待ちます。
  alts:
  - ステップ 1：AI ナレッジベースを作成
  - ステップ 2：コピーか移動か
  - ステップ 3：整理プラン
safe:
  title: 何も失われません。
  points:
  - 何も削除しません。重複は「削除予定」フォルダに移し、空にするのはあなたです。
  - すべての移動は実行前にログに記録されます。読める Markdown の表です。
  - 取り消すと、その回の整理を元に戻します。その後の変更は上書きしません。
  - 20 ファイルを超える場合や重複がある場合は、まずプラン全体を表示し、あなたが承認するまで何も動かしません。
  - メモの本文は書き換えません。先頭に出典や日付などのプロパティを追加するだけです。
  alt: 整理後のナレッジベース：サイドバーのフォルダと「5 ファイルを整理しました · 取り消す」のバナー。
ai:
  kicker: AI コンテキスト管理
  title: 最初のファイルから AI に伝わる
  body: すべてのナレッジベースには、Inkstone が書いて最新に保つ 3 つの入口ファイルがあります。フォルダを AI アシスタントやエージェントに渡せば、何のフォルダで、どこに何があり、どのファイルを信頼すべきかがわかります。
  files:
  - name: AGENTS.md
    desc: これは何か、そしてエージェントが守るルール
  - name: README.md
    desc: 人にも機械にも読めるフォルダの地図
  - name: SOURCE_OF_TRUTH.md
    desc: 何についてどのファイルが正か
  foot: 書き換えるのは Inkstone のマーカーの間だけ。その外にあなたが書いたものは残ります。
  alt: Mac の Inkstone で開いた AGENTS.md。
rules:
  title: ルールは普通の言葉で
  body: 整理ルールはナレッジベースの中のファイルです。設定でメモのように編集でき、1 行 1 ルール。プライバシーの確認のすぐ後、ほかの何よりも先に適用されます。
  example: '## My rules


    - 請求書 → 20-Areas/Finance/Invoices

    - リフォーム → 10-Projects/Renovation'
  foot: その下に同じく普通の言葉で書かれた既定のポリシーがあり、変更も、ボタンひとつでの復元もできます。
  alt: Mac の「設定 › ナレッジベース」。
private:
  title: 設計からプライベート
  cols:
  - title: AI はデバイス上で
    body: 対応デバイスでは Apple のオンデバイスモデルが振り分け先を決めます。何もデバイスの外に出ません。
  - title: 自分のモデルも使える
    body: 初期設定はオフ。自分のキーを使う場合は、ルールで振り分けられないファイルの名前と冒頭、それにフォルダ名とルールを送ります。プライベートに見えるファイルは送りません。
  - title: ただのファイル
    body: アカウントなし、解析なし、私たちのサーバーなし。ナレッジベースは普通のファイルが入ったフォルダです。
features:
  title: 本格的な Markdown エディタでもあります
  sub: すべては普通の Markdown。他の Markdown アプリの保管庫はそのまま開け、勝手に整理されることはありません。
  items:
    live_preview:
      kicker: 編集
      title: 分割画面ではなく、その場で組まれる
      body: 見出し、太字、引用、コールアウト、チェックボックス、表、コードが打ちながらその場で組まれ、記法が見えるのはカーソルのある行だけです。読書モードは独立した読み取り専用ビュー。本文書体、コード書体、それぞれのサイズは別々に設定できます。読書モードでは記法文字は隠されるのではなく取り除かれるので、段落をコピーすると本文だけが得られます。
      alt: Inkstone のエディタ：見出し、日中英の混植された段落、チェックリスト、引用、 コールアウト、桁の揃った表、コードブロックがその場で組まれている。
    links:
      kicker: リンク
      title: ウィキリンク、別名、ブロック、バックリンク
      body: '[[ノート]]、[[ノート#見出し]]、[[ノート^ブロック]]、![[埋め込み]]、そしてフロントマターで宣言した別名が、ひとつの索引にまとまります。各ノートは、 何が自分を指し、自分が何を指し、どのリンクがまだ行き先を持たないかを示します。'
      alt: ノートの右サイドバーにバックリンクと発リンクが並び、その下に近傍のローカルグラフ。
    graph:
      kicker: 形を見る
      title: 二度開いても同じ場所に落ち着くグラフ
      body: 力学シミュレーションは決定的なので、同じ保管庫は毎回同じ絵を描きます。 開くたびに読み直すのではなく、配置そのものを覚えられます。ローカルグラフは一つのノートとその隣人だけを映します。
      alt: グラフビュー：ノードとしてのノートが、ウィキリンクで結ばれ、参照の密度で寄り集まる。
    canvas:
      kicker: 空間に置くノート
      title: キャンバス、オープンな JSON Canvas 形式で
      body: カード、ファイル、線を無限の紙の上に置き、JSON Canvas 1.0 として保存します。 この形式の他の実装が読み書きするのと同じファイルです。キャンバスもノートと同じように持ち出せます。
      alt: 無限のキャンバス上に、ノートカードとその接続が空間的に配置されている。
    search:
      kicker: 見つける
      title: あいまい検索と、演算子の使える全文検索
      body: 'ひと押しで保管庫全体を対象にしたあいまい検索が開きます。全文検索は tag: と path: を解釈し、タグは本文中でもフロントマターでも、入れ子でも、どの文字体系でも機能します。#プロジェクト/進行中は #project/active とまったく同じに索引されます。一万件規模の保管庫でも待たされません。検索はメインスレッドの外で走ります。'
      alt: ノートの上に開いたクイックスイッチャーが、入力に従って保管庫を絞り込んでいく。
    sync:
      kicker: 二台目のために
      title: iCloud か GitHub、そして何を運ぶかはあなたが決める
      body: iCloud で同期するか、保管庫を GitHub のリポジトリへ push します。同期が始まってからは、衝突で何かが上書きされることはありません。両側で変更されたノートは、もう一方の版が競合コピーとしてあなたの版の隣に残ります。種類ごとのフィルタで添付やメディアを運ぶか決められ、保管庫自身の .gitignore は尊重されます。
      alt: GitHub 同期の設定：リポジトリとブランチの選択、および同期対象をファイル種別で決めるスイッチ。
duo:
  title: iPhone Duo：ひとつのノート、四つのかたち
  sub: 閉じれば、いつもの iPhone 版。開けば、サイドバーとノートが横に並びます。半開きでは、折り目の片側にノート、反対側にバックリンク・アウトライン・プロパティ。折り目をまたいで描くものはありません。
  video_alt: iPhone Duo 上の Inkstone の録画：閉じた外側の画面のノート一覧、開いてサイドバーと並んだ同じノート、本のように半開きにして右ページにインスペクタ、縦に持って折り目の下にインスペクタ。
  caption: iPhone Duo シミュレータ（iOS 27.2）で収録し、Apple の iPhone Duo 製品ベゼルに各テイクの形で収めました。画面は収録そのまま（ディゾルブ以外は無編集）。
faq:
  title: よくある質問
  items:
  - q: AI ナレッジベースとは？
    a: あなたのメモやファイルを、あなたにも AI にも探しやすく整理したフォルダです。AI に何がどこにあるかを伝える入口ファイル付き。Inkstone では普通のフォルダのままです。
  - q: AI コンテキスト管理とは？
    a: AI アシスタントに正しいファイルとその扱い方を渡すこと。AGENTS.md と SOURCE_OF_TRUTH.md がどのエージェントにもそれを伝えます。
  - q: Obsidian の保管庫で使えますか？
    a: はい。保管庫として開いた場合はそのままです。整理されるのは Inkstone が作成・引き継いだナレッジベースだけです。
  - q: 対応デバイスは？
    a: macOS 26 の Mac、iOS 26 の iPhone と iPad。オンデバイスモデルには Apple Intelligence 対応デバイスが必要で、非対応の場合はルールで整理します。
  - q: 料金は？
    a: Inkstone は無料です。Mac 版も App Store 版も。
specs:
  title: 仕様
  sub: 何かをダウンロードする前に知っておく価値のある部分。
  rows:
  - k: ナレッジベース
    v: 受信箱、プロジェクト、エリア、資料、メディア、成果物、プライベート、確認、アーカイブ。AGENTS.md・README.md・SOURCE_OF_TRUTH.md を最新に保ちます
  - k: 整理
    v: あなたのルール、次に Apple のオンデバイスモデル（または自分のモデル、初期設定オフ）。記録あり、取り消し可能、削除なし
  - k: 対応環境
    v: macOS 26 と iOS 26、ひとつの SwiftUI コードベース。Mac 版はユニバーサルで、Apple シリコンと Intel の両方に対応
  - k: 保存
    v: 自分で選んだフォルダの素の Markdown ファイル。データベースも取り込みもなし
  - k: 互換性
    v: Obsidian の保管庫をそのまま双方向に開けます。キャンバスは JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown に加え、ウィキリンク、埋め込み、ブロック参照、コールアウト、脚注、数式、Mermaid
  - k: 同期
    v: iCloud または GitHub リポジトリ、ファイル種別ごとのフィルタ付き
  - k: ワークフロー
    v: Obsidian と同じプレースホルダのテンプレート、PDF・HTML への書き出し、コマンドパレット、Spotlight 検索、ショートカットのアクション
  - k: 表示言語
    v: English、简体中文、繁體中文
  - k: ソース
    v: GitHub で公開。ライセンスはまだ決めていません。
  - k: プライバシー
    v: アカウント不要、テレメトリなし、頼んでいない通信もなし
  closer: 無料で、何も隠さず、作られるナレッジベースはもともとあなたのフォルダです。
