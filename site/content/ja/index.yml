hero:
  eyebrow: macOS 26 · iOS 26 · ネイティブ SwiftUI
  title: ノートはもともとファイルだ。そのままでいい。
  lede: Inkstone は、あなたが指定したフォルダの Markdown をそのまま読み書きします。 いま持っている保管庫をそのまま開き、他のエディタで開けないものは何も書きません。 アプリ自身の状態は隠しフォルダに置かれ、いつ消してもかまいません。
  note: 無料 · Apple シリコン · English · 简体中文 · 繁體中文
  video_alt: macOS 上の Inkstone の画面収録：保管庫を開き、漢字とラテン文字が混ざった一行を打ち、 ウィキリンクをたどり、グラフを開くまで。
  video_caption: macOS 26 で収録。区切りのディゾルブ以外、編集はしていません。
creed:
  title: 三つの決定、そこから残りすべてが出てくる
  sub: どれも構造材です。このアプリがこう振る舞う理由はここにあります。
  columns:
  - title: ファイルが事実である
    body: データベースも、取り込み手順も、独自形式もありません。Obsidian が作った保管庫はここで開き、ここで作った保管庫は向こうで開きます。Inkstone が明日消えても、 手元に残るのは Markdown の入ったフォルダです。
  - title: 壊れたリンクは元に戻らない
    body: 直してくれるデータベースがない以上、ノートの名前を変えると、それを指していたウィキリンクは同じ操作の中で保管庫全体にわたって書き換えられます。上の決定の直接の帰結であって、後から付けた機能ではありません。
  - title: エンジンは画面を知らない
    body: 解析、索引、検索、グラフは、UI フレームワークを一切 import しないパッケージに住んでいます。だからシミュレータではなく本物のテストで覆われていますし、 同じエンジンを後からコマンドラインツールの土台にもできます。
features:
  title: 入っているもの
  sub: 以下はすべて実装され動いています。ロードマップではありません。
  items:
    live_preview:
      kicker: 編集
      title: 分割画面ではなく、その場で組まれる
      body: 見出し、太字、引用、コールアウト、チェックボックス、表、コードが打ちながらその場で組まれ、記法が見えるのはカーソルのある行だけです。読書モードは独立した読み取り専用ビュー。本文書体、コード書体、それぞれのサイズは別々に設定できます。
      alt: Inkstone のエディタ：見出し、日中英の混植された段落、チェックリスト、引用、 コールアウト、桁の揃った表、コードブロックがその場で組まれている。
    links:
      kicker: リンク
      title: ウィキリンク、別名、ブロック、バックリンク
      body: '[[ノート]]、[[ノート#見出し]]、[[ノート^ブロック]]、![[埋め込み]]、そしてフロントマターで宣言した別名が、ひとつの索引にまとまります。各ノートは、 何が自分を指し、自分が何を指し、どのリンクがまだ行き先を持たないかを示します。'
      alt: ノートの右サイドバーにバックリンクと発リンクが並び、その下に近傍のローカルグラフ。
    graph:
      kicker: 形を見る
      title: 二度開いても同じ場所に落ち着くグラフ
      body: 力学シミュレーションは決定的なので、同じ保管庫は毎回同じ絵を描きます。 開くたびに読み直すのではなく、配置そのものを覚えられます。ローカルグラフは一つのノートとその隣人だけを映します。
      alt: グラフビュー：ノードとしてのノートが、ウィキリンクで結ばれ、参照の密度で寄り集まる。
    canvas:
      kicker: 空間に置くノート
      title: キャンバス、オープンな JSON Canvas 形式で
      body: カード、ファイル、線を無限の紙の上に置き、JSON Canvas 1.0 として保存します。 この形式の他の実装が読み書きするのと同じファイルです。キャンバスもノートと同じように持ち出せます。
      alt: 無限のキャンバス上に、ノートカードとその接続が空間的に配置されている。
    search:
      kicker: 見つける
      title: あいまい検索と、演算子の使える全文検索
      body: 'ひと押しで保管庫全体を対象にしたあいまい検索が開きます。全文検索は tag: と path: を解釈し、タグは本文中でもフロントマターでも、入れ子でも、どの文字体系でも機能します。#プロジェクト/進行中は #project/active とまったく同じに索引されます。'
      alt: ノートの上に開いたクイックスイッチャーが、入力に従って保管庫を絞り込んでいく。
    sync:
      kicker: 二台目のために
      title: iCloud か GitHub、そして何を運ぶかはあなたが決める
      body: iCloud で同期するか、保管庫を GitHub のリポジトリへ push します。衝突は一度決着させ、両方を残したりしません。種類ごとのフィルタで添付やメディアを運ぶか決められ、保管庫自身の .gitignore は尊重されます。
      alt: GitHub 同期の設定：リポジトリとブランチの選択、および同期対象をファイル種別で決めるスイッチ。
typography:
  title: 漢字とラテン文字を一行に組む
  sub: 難しいのは、和文の中に欧文の単語が入る場合です。ほとんどのアプリはこれを外し、 しかも一度気づくと二度と見過ごせない外し方をします。
  folio: 見本 · Source Serif 4 と源ノ明朝
  specimen_title: 和欧混植と四分アキ
  specimen_lead: 和文はベタ組みです。単語間に空きがないぶん、行の均一さがそのまま読みやすさになります。 そこに typography と入れば、二つの文字体系はぶつかります。
  specimen_body: 本文中にLatinの語が現れるとき、漢字とラテン文字のあいだには四分ほどのアキが要ります。 日本語組版処理の要件がいう和欧文間の空きであり、W3Cの中文排版需求では文字間隙と呼ばれます。この段落自体がその実演です。漢字とLatinの境目はすべて、ビルド時に挿入された空の要素で開かれ、text-autospaceに対応したブラウザではブラウザ側に委ねられます。二つが同時に効くことはありません。全角約物（、。；：）はもともと二分アキを持つので、そこには何も足しません。
  specimen_quote: 組版は内容に敬意を払うために存在する。それは従者であり、従者の作法は目に見えないほうがよい。
  specimen_cite: Robert Bringhurst『The Elements of Typographic Style』
  notes:
  - term: 行長
    def: 本文は一行およそ 66 字。Bringhurst が一段組の理想とした幅です。75 を超えると目が次の行頭を見失います。
  - term: ひとつの書体族
    def: 欧文は Source Serif 4、和文は源ノ明朝。源ノ明朝の欧文部分はそもそも Source Serif なので、混植された行は一人の設計者の明朝であり、二つの書体の衝突ではありません。
  - term: 色は意味である
    def: 朱の一色だけ — 印を紙に押したときのあの赤 — がリンク、タグ、現在の操作を示します。 ほかに色のついたものはありません。
  - term: 動きは句読点である
    def: 要素は現れるときに 8 ピクセル上がり、それ以外は何も動きません。「視差効果を減らす」を入れていれば、それも一度も起きません。
specs:
  title: 仕様
  sub: 何かをダウンロードする前に知っておく価値のある部分。
  rows:
  - k: 対応環境
    v: macOS 26 と iOS 26、ひとつの SwiftUI コードベース、Apple シリコン
  - k: 保存
    v: 自分で選んだフォルダの素の Markdown ファイル。データベースも取り込みもなし
  - k: 互換性
    v: Obsidian の保管庫をそのまま双方向に開けます。キャンバスは JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown に加え、ウィキリンク、埋め込み、ブロック参照、コールアウト、脚注、数式、Mermaid
  - k: 同期
    v: iCloud または GitHub リポジトリ、ファイル種別ごとのフィルタ付き
  - k: 表示言語
    v: English、简体中文、繁體中文
  - k: ソース
    v: GitHub で公開。ライセンスはまだ決めていません。
  - k: プライバシー
    v: アカウント不要、テレメトリなし、頼んでいない通信もなし
  closer: 無料で、何も囲い込まず、書き出されるファイルはあなたがもともと持っていたファイルです。
