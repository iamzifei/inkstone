title: Inkstone 墨硯 — ノートをファイルのまま置いておく macOS / iOS アプリ
description: 自分で選んだフォルダに置かれた素の Markdown ファイル。ウィキリンク、バックリンク、 グラフ、キャンバス、デイリーノート。macOS 26 と iOS 26 のためのネイティブ SwiftUI。 データベースなし、Electron なし、アカウント不要。
