title: 自分で整理される AI ナレッジベース — Inkstone（Mac・iPhone・iPad）
description: 普通のフォルダで個人の AI ナレッジベースを。メモ、PDF、写真、録音を入れると、Inkstone があなたのルールとデバイス上のモデルで振り分け、AI アシスタント向けに AGENTS.md を書きます。無料。
crumb: AI ナレッジベース
h1: 自分で整理される AI ナレッジベース
lede: メモ、PDF、写真、録音をひとつのフォルダに入れるだけ。Inkstone が普通の言葉で書いたルールと Apple のオンデバイスモデルで一つずつ振り分け、どの AI アシスタントにも読めるフォルダに保ちます。
hero_shot: mac-k1-plan
hero_alt: Mac の Inkstone：入れた 5 つのファイルの整理プラン。
sections:
- h2: AI ナレッジベースとは？
  paras:
  - あなた自身のメモやファイルを、あなたにも AI アシスタントにも見つけやすく整理し、どこに何があり、どのファイルを信頼すべきかを文章で示したものです。普通のメモフォルダとの違いはこの後半です。AI はあなたに「請求書はどこ？」と聞けません。
  - Inkstone ではそれは Markdown とファイルが入った普通のフォルダのまま。データベースに閉じ込められず、どのアプリも、どの AI エージェントも読めます。
- h2: Inkstone の作り方
  list:
  - 人にも AI にも使いやすい構成：受信箱、プロジェクト、エリア、資料、メディア、成果物、プライベート。加えて、判断に迷うものの確認用フォルダと、重複を置くアーカイブ。
  - まずルール：あなたのルール、次にプライバシー（身分証、銀行、医療はプライベートへ）、次にファイルが示すプロジェクト、メディアは種類と月ごと。
  - 残りはオンデバイスモデルに。ファイルの冒頭を読んでフォルダと名前を提案し、確信が持てなければファイルはあなたを待ちます。
  - ひと目でわかる名前：20261119-リフォーム見積.md（日付、次にテーマ）。
  - AI 向けの入口ファイル：AGENTS.md、README.md、SOURCE_OF_TRUTH.md。フォルダが変わるたびに書き直します。
  shot: mac-k2-organized
  alt: 整理後のナレッジベースと「取り消す」バナー。
- h2: 安心して任せられる
  paras:
  - 何も削除しません。すべての移動は実行前に記録され、1 回分の整理をバイト単位で取り消せます。メモの本文は書き換えません。大きな整理や重複はあなたの承認を待ちます。
- h2: iPhone と iPad でも
  paras:
  - 「ファイル」アプリから追加すると受信箱に入り、同じように振り分けられます。ナレッジベースは iCloud Drive にあるので、Mac と iPhone で同じフォルダが見えます。
  shot: iphone-k4-drop
  alt: iPhone：コピーか移動か
faq:
  title: よくある質問
  items:
  - q: AI は私のファイルをすべて読みますか？
    a: オンデバイスモデルが読むのは、ルールで振り分けられなかったファイルの冒頭だけで、あなたのデバイス上です。クラウドのモデルは自分のキーを入れてオンにしたときだけ使われ、プライベートに見えるファイルは送りません。
  - q: Obsidian と使えますか？
    a: Obsidian の保管庫はそのまま開き、整理し直されることはありません。Inkstone が作るナレッジベースは普通の Markdown で、Obsidian でも開けます。
  - q: 対応デバイスは？
    a: Mac（macOS 26）、iPhone と iPad（iOS 26）。オンデバイスモデルには Apple Intelligence 対応デバイスが必要で、非対応ならルールで整理します。
  - q: 料金は？
    a: 無料です。Mac 版も App Store 版も、アカウント不要。
