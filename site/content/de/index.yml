title: Inkstone — KI-Wissensdatenbank für Mac, iPhone und iPad
description: 'Eine KI-Wissensdatenbank, die sich selbst ordnet: Notizen, PDFs und Fotos hineinziehen – Inkstone legt sie nach deinen Regeln ab. Kostenlos.'
