hero:
  eyebrow: KI-Wissensdatenbank · Mac · iPhone · iPad
  title: Einfach hineinziehen. Es ordnet sich selbst.
  lede: Inkstone macht aus einem Ordner eine KI-Wissensdatenbank. Notizen, PDFs, Fotos, Aufnahmen – jede Datei wird nach Regeln abgelegt, die du lesen und ändern kannst, mit einer KI, die auf deinem Gerät läuft. Nichts wird je gelöscht, und jede Runde lässt sich rückgängig machen.
  note: Kostenlos · Kein Konto · English · 简体中文 · 繁體中文
  mac_alt: 'Inkstone auf dem Mac: Bevor fünf hineingezogene Dateien abgelegt werden, zeigt es den Plan – abgelegt, privat, Duplikate beiseite – und wartet auf „Organize“.'
  phone_alt: Derselbe Plan auf dem iPhone.
how:
  title: Eine Wissensdatenbank in drei Schritten
  sub: Nichts einzurichten. Ein Name, ein Ort und etwas zum Hineinziehen.
  steps:
  - title: Benennen, Ort wählen
    body: iCloud Drive, ein beliebiger Ordner oder ein Ordner, den du schon hast. Inkstone legt die Ordner an – Eingang, Projekte, Bereiche, Ressourcen, Medien, Ergebnisse, Privat – und schreibt die Ordnungsregeln.
  - title: Alles hineinziehen
    body: Dateien aufs Fenster ziehen oder aus der App „Dateien“ hinzufügen. Beim ersten Mal wählst du Kopieren oder Verschieben – Kopieren ist voreingestellt.
  - title: Es wird für dich abgelegt
    body: Zuerst nach deinen Regeln, dann vom Modell auf dem Gerät. Umbenannt nach Datum und Thema. Unsicheres wartet in einem Prüfordner auf dich.
  alts:
  - 'Schritt 1: Deine KI-Wissensdatenbank anlegen'
  - 'Schritt 2: Kopieren oder verschieben?'
  - 'Schritt 3: der Plan – abgelegt, privat, Duplikate beiseite'
safe:
  title: Nichts geht verloren. Nie.
  points:
  - Nichts wird je gelöscht. Duplikate landen in einem Ordner zum Löschen, den du selbst leerst.
  - Jede Verschiebung wird vorher protokolliert – eine Markdown-Tabelle, die du lesen kannst.
  - Rückgängig stellt eine ganze Runde Byte für Byte wieder her, ohne deine späteren Änderungen zu überschreiben.
  - Mehr als 20 Dateien oder Duplikate? Du siehst erst den ganzen Plan, und nichts bewegt sich ohne dein Ja.
  - 'Der Text einer Notiz wird nie umgeschrieben: oben kommen nur Quelle und Datum dazu.'
  alt: 'Die Wissensdatenbank nach einer Runde: Ordner in der Seitenleiste und ein Banner – 5 Dateien geordnet, Rückgängig.'
ai:
  kicker: KI-Kontextverwaltung
  title: Bereit für KI, ab der ersten Datei
  body: Jede Wissensdatenbank hat drei Einstiegsdateien, die Inkstone schreibt und aktuell hält. Gib den Ordner einem beliebigen KI-Assistenten oder Agenten, und er weiß, was das ist, wo was liegt und welcher Datei er trauen kann.
  files:
  - name: AGENTS.md
    desc: was das ist, und die Regeln, die ein Agent hier befolgt
  - name: README.md
    desc: die Ordnerkarte, für Menschen und Maschinen
  - name: SOURCE_OF_TRUTH.md
    desc: welche Datei wofür maßgeblich ist
  foot: Nur der Teil zwischen den Markierungen von Inkstone wird neu geschrieben. Was du drumherum ergänzt, bleibt.
  alt: AGENTS.md in Inkstone auf dem Mac geöffnet.
rules:
  title: Deine Regeln, in einfachen Worten
  body: Die Ordnungsregeln sind eine Datei in deiner Wissensdatenbank. Bearbeite sie in den Einstellungen wie eine Notiz – eine Zeile pro Regel – und sie gehen allem anderen vor.
  example: '## My rules


    - Rechnungen → 20-Areas/Finance/Invoices

    - Renovierung → 10-Projects/Renovation'
  foot: Darunter steht die Standardrichtlinie, in denselben einfachen Worten – änderbar, oder mit einem Klick wiederhergestellt.
  alt: Einstellungen › Wissensdatenbank auf dem Mac.
private:
  title: Privat von Grund auf
  cols:
  - title: KI auf deinem Gerät
    body: Apples Modell auf dem Gerät entscheidet, wohin eine Datei gehört – auf Geräten, die es unterstützen. Nichts verlässt das Gerät.
  - title: Oder dein eigenes Modell
    body: Standardmäßig aus. Mit deinem eigenen Schlüssel werden nur Name und Anfang einer Datei gesendet, die die Regeln nicht einordnen – nie eine Datei, die privat aussieht.
  - title: Nur Dateien
    body: Kein Konto, keine Analyse, kein Server von uns. Deine Wissensdatenbank ist ein Ordner gewöhnlicher Dateien.
features:
  title: Auch ein vollständiger Markdown-Editor
  sub: Alles bleibt einfaches Markdown. Ein Tresor aus einer anderen Markdown-App öffnet sich unverändert – und wird nie umsortiert.
  items:
    live_preview:
      kicker: Schreiben
      title: Live-Vorschau statt geteiltem Fenster
      body: Überschriften, Fettung, Zitate, Callouts, Checkboxen, Tabellen und Code werden beim Tippen an Ort und Stelle gesetzt; die Syntax zeigt sich nur in der Zeile, in der die Einfügemarke steht. Der Lesemodus ist eine eigene, schreibgeschützte Ansicht. Textschrift, Codeschrift und ihre Größen werden unabhängig voneinander eingestellt. Im Lesemodus sind die Syntaxzeichen entfernt statt versteckt — ein kopierter Absatz enthält nur den Text.
      alt: 'Der Editor von Inkstone mit Live-Vorschau: Überschrift, ein Absatz aus gemischt chinesischer und lateinischer Schrift, eine Checkliste, ein Zitat, ein Callout, eine ausgerichtete Tabelle und ein Codeblock.'
    links:
      kicker: Verknüpfen
      title: Wikilinks, Aliase, Blöcke, Backlinks
      body: '[[Notiz]], [[Notiz#Überschrift]], [[Notiz^Block]], ![[Einbettungen]] und im Frontmatter deklarierte Aliase laufen alle in einen Index. Jede Notiz zeigt, was auf sie zeigt, worauf sie zeigt und welche ihrer Links noch kein Ziel haben.'
      alt: Eine Notiz, deren Backlinks und ausgehende Links in der rechten Seitenleiste stehen, darunter ein kleiner lokaler Graph der Nachbarn.
    graph:
      kicker: Die Form sehen
      title: Ein Graph, der sich zweimal gleich legt
      body: 'Die Kräftesimulation ist deterministisch: derselbe Tresor zeichnet jedes Mal dasselbe Bild. Man kann sich seine Anordnung merken, statt sie bei jedem Öffnen neu zu lesen. Der lokale Graph zeigt eine Notiz und ihre Nachbarn.'
      alt: 'Die Graphansicht: Notizen als Knoten, verbunden durch ihre Wikilinks und geballt nach der Dichte ihrer Verweise.'
    canvas:
      kicker: Räumliche Notizen
      title: Canvas, im offenen Format JSON Canvas
      body: Karten, Dateien und Verbindungen auf einem unendlichen Blatt, gespeichert als JSON Canvas 1.0 — dieselbe Datei, die auch die anderen Implementierungen des Formats lesen und schreiben. Ihre Canvas sind so portabel wie Ihre Notizen.
      alt: Ein Canvas mit Notizkarten und Verbindungen, räumlich auf einem unendlichen Blatt angeordnet.
    search:
      kicker: Finden
      title: Unscharfer Umschalter, und Suche mit Operatoren
      body: 'Ein Tastendruck öffnet eine unscharfe Suche über alle Notizen. Die Volltextsuche versteht tag: und path:, und Schlagwörter funktionieren im Text wie im Frontmatter, verschachtelt, in jeder Schrift — #项目/进行中 wird genau wie #project/active indiziert. Auch bei zehntausend Notizen wartet nichts: Die Suche läuft außerhalb des Hauptthreads.'
      alt: Der Schnellumschalter über einer Notiz, der den Tresor beim Tippen Zeichen für Zeichen filtert.
    sync:
      kicker: Zwei Geräte
      title: iCloud oder GitHub, und Sie bestimmen, was mitreist
      body: 'Synchronisieren Sie über iCloud, oder schieben Sie den Tresor in ein GitHub-Repository. Sobald ein Tresor synchronisiert wird, überschreibt ein Konflikt nie etwas: Haben beide Seiten eine Notiz geändert, bleibt die andere Fassung als Konfliktkopie neben Ihrer liegen. Filter je Dateityp entscheiden, ob Anhänge und Medien mitkommen, und die .gitignore des Tresors wird respektiert.'
      alt: 'Die Einstellungen der GitHub-Synchronisierung: Auswahl von Repository und Branch sowie Schalter je Dateityp.'
duo:
  title: 'iPhone Duo: eine Notiz, vier Formen'
  sub: Zugeklappt ist es die iPhone-App. Aufgeklappt stehen Seitenleiste und Notiz nebeneinander. Halb geöffnet liegt die Notiz auf der einen Seite des Falzes, Rückverweise, Gliederung und Eigenschaften auf der anderen – nichts wird über den Falz gezeichnet.
  video_alt: 'Eine Aufnahme von Inkstone auf dem iPhone Duo: die Notizliste auf dem zugeklappten Außendisplay, dieselbe Notiz aufgeklappt neben der Seitenleiste, dann halb geöffnet wie ein Buch mit dem Inspektor auf der rechten Seite, dann hochkant mit dem Inspektor unter dem Falz.'
  caption: Aufgenommen im iPhone-Duo-Simulator, iOS 27.2, gezeigt in Apples iPhone-Duo-Produktrahmen in der Haltung der jeweiligen Aufnahme; der Bildschirm ist die Aufnahme, bis auf die Überblendungen ungeschnitten.
faq:
  title: Fragen
  items:
  - q: Was ist eine KI-Wissensdatenbank?
    a: Ein Ordner mit deinen Notizen und Dateien, so geordnet, dass du und eine KI Dinge finden – mit Einstiegsdateien, die der KI sagen, was wo liegt. In Inkstone bleibt er ein einfacher Ordner.
  - q: Was ist KI-Kontextverwaltung?
    a: Einem KI-Assistenten die richtigen Dateien und die Regeln dazu geben. AGENTS.md und SOURCE_OF_TRUTH.md tun das für jeden Agenten.
  - q: Funktioniert es mit meinem Obsidian-Tresor?
    a: Ja. Als Tresor geöffnet bleibt er, wie er ist. Geordnet wird nur in einer Wissensdatenbank, die Inkstone angelegt oder übernommen hat.
  - q: Welche Geräte?
    a: Mac mit macOS 26, iPhone und iPad mit iOS 26. Das Modell auf dem Gerät braucht ein Gerät mit Apple Intelligence; ohne wird nach deinen Regeln geordnet.
  - q: Was kostet es?
    a: Inkstone ist kostenlos, auf dem Mac und im App Store.
specs:
  title: Technische Daten
  sub: Was zu wissen sich lohnt, bevor Sie irgendetwas herunterladen.
  rows:
  - k: Wissensdatenbank
    v: Eingang, Projekte, Bereiche, Ressourcen, Medien, Ergebnisse, Privat, Prüfen, Archiv – mit stets aktuellen AGENTS.md, README.md und SOURCE_OF_TRUTH.md
  - k: Ordnen
    v: Deine Regeln, dann Apples Modell auf dem Gerät (oder dein eigenes, standardmäßig aus). Protokolliert, rückgängig machbar, nichts gelöscht
  - k: Plattformen
    v: 'macOS 26 und iOS 26, eine SwiftUI-Codebasis. Die Mac-App ist universell: Apple Silicon und Intel'
  - k: Speicherung
    v: Reine Markdown-Dateien in einem Ordner Ihrer Wahl. Keine Datenbank, kein Import
  - k: Kompatibilität
    v: Obsidian-Tresore öffnen sich unverändert, in beide Richtungen. Canvas ist JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown, dazu Wikilinks, Einbettungen, Blockreferenzen, Callouts, Fußnoten, Formelsatz und Mermaid
  - k: Synchronisierung
    v: iCloud oder ein GitHub-Repository, mit Filtern je Dateityp
  - k: Arbeitsweise
    v: Vorlagen mit den Platzhaltern von Obsidian, Export als PDF oder HTML, Befehlspalette, Notizen in Spotlight, Kurzbefehle
  - k: Oberflächensprachen
    v: English, 简体中文, 繁體中文
  - k: Quelltext
    v: Öffentlich auf GitHub. Eine Lizenz ist noch nicht gewählt.
  - k: Datenschutz
    v: Kein Konto, keine Telemetrie, kein Netzaufruf, um den Sie nicht gebeten haben
  closer: Es ist kostenlos, verbirgt nichts vor dir, und die Wissensdatenbank ist ein Ordner, der dir schon gehört.
