hero:
  eyebrow: AI knowledge base · Mac · iPhone · iPad
  title: Drop anything in. It files itself.
  lede: Inkstone turns a folder into an AI knowledge base. Notes, PDFs, photos, recordings — each is filed by rules you can read and change, with an AI that runs on your device. Nothing is ever deleted, and every round can be undone.
  note: Free · No account · English · 简体中文 · 繁體中文
  mac_alt: 'Inkstone on a Mac: before filing five dropped files, it lists the plan — filed, private, duplicates put aside — and waits for Organize.'
  phone_alt: 'The same plan on iPhone: Organize 5 files?'
how:
  title: A knowledge base in three steps
  sub: No setup to learn. A name, a place, and somewhere to drop things.
  steps:
  - title: Name it, choose where it lives
    body: iCloud Drive, any folder, or a folder you already have. Inkstone lays out the folders — inbox, projects, areas, resources, media, outputs, private — and writes the organizing rules.
  - title: Drop anything in
    body: Drag files onto the window, or add them from the Files app. The first time, choose copy or move — copy is the default. On iPhone and iPad, share from any app — Safari, Photos, Files, Mail — and it lands in the inbox.
  - title: It is filed for you
    body: Private-looking files go to the private folder first, then your rules, then the on-device model. Renamed by date and topic. Anything unsure waits in a review folder for you to decide.
  alts:
  - 'Step 1 on iPhone: Your AI knowledge base — Create my knowledge base'
  - 'Step 2: Copy or move 3 items into your knowledge base?'
  - 'Step 3: the plan — filed, private, duplicates put aside'
safe:
  title: Nothing is lost. Ever.
  points:
  - Nothing is ever deleted. Duplicates are put aside in a to-delete folder, for you to empty.
  - Every move is written to a log before it is made — a Markdown table you can read.
  - Undo puts a whole round back, without overwriting anything you changed since.
  - More than 20 files, or duplicates? You see the whole plan first, and nothing moves until you say so.
  - 'A note''s text is never rewritten: only properties such as its source and date are added at the top.'
  alt: 'The knowledge base after a round: its folders in the sidebar, and a banner — Organized 5 files, Undo.'
ai:
  kicker: AI context management
  title: Ready for AI, from the first file
  body: Every knowledge base carries three entry files, written and kept up to date by Inkstone. Hand the folder to any AI assistant or agent and it knows what the knowledge base is, where things live, and which file to trust.
  files:
  - name: AGENTS.md
    desc: what this is, and the rules an agent follows here
  - name: README.md
    desc: the folder map, for people and machines
  - name: SOURCE_OF_TRUTH.md
    desc: which file is authoritative for what
  foot: Only the part between Inkstone's markers is rewritten. What you add around it stays.
  alt: 'AGENTS.md open in Inkstone on a Mac: what this is, rules for AI agents, and where everything lives.'
rules:
  title: Your rules, in plain words
  body: The organizing rules are a file in your knowledge base. Edit them in Settings like a note — one line per rule. They come right after the privacy check, before everything else.
  example: '## My rules


    - Invoices → 20-Areas/Finance/Invoices

    - Renovation → 10-Projects/Renovation'
  foot: Below your rules sits the default policy, in the same plain words — change it, or put it back with one button.
  alt: 'Settings › Knowledge Base on a Mac: organize automatically, the on-device model, what dropping files does.'
private:
  title: Private by construction
  cols:
  - title: AI on your device
    body: Apple's on-device model decides where a file goes, on devices that support it. Nothing leaves the device.
  - title: Or your own model
    body: Off by default. With your own key, it is sent the name and start of a file the rules can't place, with your folder names and rules — never a file that looks private.
  - title: Just files
    body: No account, no analytics, no server of ours. Your knowledge base is a folder of ordinary files you can open with anything.
features:
  title: A full Markdown editor, too
  sub: Everything is plain Markdown. A vault from another Markdown app opens as it is — and is never reorganized.
  items:
    live_preview:
      kicker: Editing
      title: Live preview, not a split screen
      body: Headings, bold, quotes, callouts, checkboxes, tables and code all render in place as you type, with the syntax revealed on the line the cursor is on. Reading mode is a separate, read-only view when you want the page without the scaffolding. Body font, code font and their sizes are set independently. In reading mode the syntax characters are gone rather than hidden, so copying a paragraph gives you prose.
      alt: 'The Inkstone editor showing live preview: a heading, a mixed Chinese-English paragraph, a checklist, a quote, a callout, an aligned table and a code block, all rendered in place.'
    links:
      kicker: Linking
      title: Wikilinks, aliases, blocks, backlinks
      body: '[[Note]], [[Note#Heading]], [[Note^block]], ![[Embeds]] and aliases declared in frontmatter, all resolved into one index. Every note shows what points at it, what it points at, and which of its links have no target yet.'
      alt: A note with its backlinks and outgoing links listed in the right sidebar, alongside a small local graph of its neighbours.
    graph:
      kicker: Seeing the shape
      title: A graph that settles in the same place twice
      body: The force simulation is deterministic, so the same vault draws the same picture every time and you can learn its layout rather than re-reading it on every open. Local graph shows one note and its neighbours.
      alt: 'The graph view: notes as nodes joined by their wikilinks, clustered by how densely they reference one another.'
    canvas:
      kicker: Spatial notes
      title: Canvas, in the open JSON Canvas format
      body: Cards, files and links on an infinite sheet, saved as JSON Canvas 1.0 — the same file the format's other implementations read and write. Your canvases are as portable as your notes.
      alt: A canvas with note cards and connections laid out spatially on an infinite sheet.
    search:
      kicker: Finding things
      title: Fuzzy switcher, and search that takes operators
      body: 'One keystroke opens a fuzzy switcher over every note. Full-text search understands tag: and path:, and tags work inline or in frontmatter, nested, in any script — #项目/进行中 indexes exactly like #project/active. Both stay out of the way on a vault of ten thousand notes: the search runs off the main thread, so typing never waits for the disk.'
      alt: The quick switcher open over a note, filtering the vault as characters are typed.
    sync:
      kicker: Two machines
      title: iCloud or GitHub, and you choose what travels
      body: 'Sync through iCloud, or push the vault to a GitHub repository. Once a vault is syncing, a conflict never overwrites anything: when both sides changed a note, the other version is kept beside yours as a conflict copy. Per-type filters decide whether attachments and media go with it, and the vault''s own .gitignore is respected.'
      alt: 'The GitHub sync settings: repository and branch pickers, and per-file-type switches deciding what is synchronised.'
duo:
  title: 'iPhone Duo: one note, four shapes'
  sub: Folded, it is the iPhone app. Unfolded, the sidebar and the note sit side by side. Half-open, the note takes one side of the crease and its backlinks, outline and properties the other — nothing is drawn across the fold.
  video_alt: 'A recording of Inkstone on iPhone Duo: the note list on the folded outer screen, the same note unfolded beside the sidebar, then half-open like a book with the inspector on the right page, then upright with the inspector below the crease.'
  caption: Recorded in the iPhone Duo simulator, iOS 27.2, and shown in Apple’s iPhone Duo product bezels, in the posture of each take; the screen is the recording, unedited apart from the dissolves.
faq:
  title: Questions
  items:
  - q: What is an AI knowledge base?
    a: A folder of your notes and files, organized so both you and an AI can find things — with entry files that tell an AI what is where. In Inkstone it stays a plain folder.
  - q: What is AI context management?
    a: Giving an AI assistant the right files and the rules for them. AGENTS.md and SOURCE_OF_TRUTH.md do that for any agent you point at the folder.
  - q: Does it work with my Obsidian vault?
    a: Yes. Opened as a vault, it is left exactly as it is. Organizing only happens in a knowledge base made or adopted by Inkstone.
  - q: Which devices?
    a: Mac with macOS 26, iPhone and iPad with iOS 26. The on-device model needs a device that supports Apple Intelligence; without it, files are organized by your rules.
  - q: How much does it cost?
    a: Inkstone is free, on the Mac and on the App Store.
specs:
  title: Specifications
  sub: The parts worth knowing before you download anything.
  rows:
  - k: Knowledge base
    v: Inbox, projects, areas, resources, media, outputs, private, review, archive — with AGENTS.md, README.md and SOURCE_OF_TRUTH.md kept up to date
  - k: Organizing
    v: Privacy first, then your rules, then Apple's on-device model (or your own, off by default). Logged, undoable, nothing deleted
  - k: Platforms
    v: 'macOS 26 and iOS 26, one SwiftUI codebase. The Mac app is universal: Apple silicon and Intel'
  - k: Storage
    v: Plain Markdown files in a folder you pick. No database, no import
  - k: Compatibility
    v: Obsidian vaults open unchanged, both directions. Canvas is JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown, plus wikilinks, embeds, block references, callouts, footnotes, maths and Mermaid
  - k: Sync
    v: iCloud or a GitHub repository, with per-file-type filters
  - k: Workflow
    v: Templates with Obsidian's placeholders, export to PDF or HTML, a command palette, notes in Spotlight, Shortcuts actions
  - k: Interface languages
    v: English, 简体中文, 繁體中文
  - k: Source
    v: Public on GitHub. A licence has not been chosen yet.
  - k: Privacy
    v: No account, no telemetry, no network call you did not ask for
  closer: It is free, it keeps nothing from you, and the knowledge base it builds is a folder you already own.
