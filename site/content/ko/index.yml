hero:
  eyebrow: AI 지식 베이스 · Mac · iPhone · iPad
  title: 무엇이든 넣으세요. 알아서 정리됩니다.
  lede: Inkstone은 폴더를 AI 지식 베이스로 바꿉니다. 메모, PDF, 사진, 녹음을 읽고 고칠 수 있는 규칙과 기기에서 실행되는 AI로 분류합니다. 아무것도 삭제되지 않으며, 모든 정리는 되돌릴 수 있습니다.
  note: 무료 · 계정 불필요 · English · 简体中文 · 繁體中文
  mac_alt: 'Mac의 Inkstone: 넣은 파일 5개를 분류하기 전에 계획(분류, 비공개, 중복 따로)을 보여 주고 확인을 기다리는 화면.'
  phone_alt: iPhone에서의 같은 계획.
how:
  title: 세 단계로 지식 베이스 만들기
  sub: 배울 설정이 없습니다. 이름과 위치를 정하고 넣기만 하세요.
  steps:
  - title: 이름과 위치 정하기
    body: iCloud Drive, 아무 폴더, 또는 이미 있는 폴더. 받은 편지함, 프로젝트, 영역, 자료, 미디어, 결과물, 비공개 폴더와 정리 규칙을 Inkstone이 만들어 둡니다.
  - title: 무엇이든 넣기
    body: 창으로 끌어오거나 파일 앱에서 추가하세요. 처음에는 복사 또는 이동을 고릅니다(기본값은 복사).
  - title: 알아서 분류
    body: 먼저 당신의 규칙, 그다음 기기 내 모델. 날짜와 주제로 이름을 바꿉니다. 애매한 것은 검토 폴더에서 기다립니다.
  alts:
  - '1단계: AI 지식 베이스 만들기'
  - '2단계: 복사할까요, 이동할까요?'
  - '3단계: 정리 계획'
safe:
  title: 아무것도 잃지 않습니다.
  points:
  - 아무것도 삭제하지 않습니다. 중복 파일은 '삭제 예정' 폴더로 옮기고, 비우는 것은 당신입니다.
  - 모든 이동은 실행 전에 로그에 기록됩니다. 읽을 수 있는 Markdown 표입니다.
  - 되돌리기는 한 번의 정리를 바이트 단위로 원래대로 돌리며, 이후 바꾼 내용은 덮어쓰지 않습니다.
  - 파일이 20개를 넘거나 중복이 있으면 먼저 전체 계획을 보여 주고, 승인 전에는 아무것도 옮기지 않습니다.
  - 메모 본문은 바꾸지 않습니다. 맨 위에 출처와 날짜만 추가합니다.
  alt: '정리 후의 지식 베이스: 사이드바의 폴더와 ''파일 5개 정리됨 · 되돌리기'' 배너.'
ai:
  kicker: AI 컨텍스트 관리
  title: 첫 파일부터 AI가 알아봅니다
  body: 모든 지식 베이스에는 Inkstone이 작성하고 최신으로 유지하는 입구 파일 세 개가 있습니다. 폴더를 AI 어시스턴트나 에이전트에 건네면 무엇인지, 어디에 무엇이 있는지, 어떤 파일을 믿어야 하는지 압니다.
  files:
  - name: AGENTS.md
    desc: 이것이 무엇이고, 에이전트가 여기서 지킬 규칙
  - name: README.md
    desc: 사람과 기계 모두를 위한 폴더 지도
  - name: SOURCE_OF_TRUTH.md
    desc: 무엇에 대해 어떤 파일이 기준인지
  foot: Inkstone 표시 사이 부분만 다시 씁니다. 그 밖에 당신이 쓴 내용은 그대로입니다.
  alt: Mac의 Inkstone에서 연 AGENTS.md.
rules:
  title: 규칙은 쉬운 말로
  body: 정리 규칙은 지식 베이스 안의 파일입니다. 설정에서 메모처럼 고치세요. 한 줄에 규칙 하나, 당신의 규칙이 가장 먼저입니다.
  example: '## My rules


    - 청구서 → 20-Areas/Finance/Invoices

    - 리모델링 → 10-Projects/Renovation'
  foot: 그 아래에는 같은 쉬운 말로 된 기본 정책이 있어, 고치거나 버튼 하나로 되돌릴 수 있습니다.
  alt: Mac의 설정 › 지식 베이스.
private:
  title: 설계부터 비공개
  cols:
  - title: 기기 안의 AI
    body: 지원 기기에서는 Apple의 기기 내 모델이 파일 위치를 정합니다. 아무것도 기기 밖으로 나가지 않습니다.
  - title: 또는 내 모델
    body: 기본값은 꺼짐. 내 키를 쓸 때도 규칙으로 분류하지 못한 파일의 이름과 앞부분만 보내며, 비공개로 보이는 파일은 보내지 않습니다.
  - title: 그냥 파일
    body: 계정도, 분석도, 우리 서버도 없습니다. 지식 베이스는 평범한 파일이 담긴 폴더입니다.
features:
  title: 완전한 Markdown 편집기이기도 합니다
  sub: 모든 것은 평범한 Markdown입니다. 다른 Markdown 앱의 보관소도 그대로 열리며, 다시 정리되지 않습니다.
  items:
    live_preview:
      kicker: 편집
      title: 분할 화면이 아니라 그 자리에서
      body: 제목, 굵게, 인용, 콜아웃, 체크박스, 표, 코드가 입력하는 대로 제자리에서 그려지고, 문법이 드러나는 것은 커서가 있는 줄뿐입니다. 읽기 모드는 별도의 읽기 전용 화면입니다. 본문 글꼴과 코드 글꼴, 각각의 크기는 따로 설정합니다. 읽기 모드에서는 문법 문자가 숨겨지는 것이 아니라 제거되므로, 문단을 복사하면 본문만 남습니다.
      alt: 'Inkstone 편집기: 제목, 한글·한자·라틴이 섞인 문단, 체크리스트, 인용, 콜아웃, 정렬된 표, 코드 블록이 모두 제자리에서 그려진 모습.'
    links:
      kicker: 연결
      title: 위키링크, 별칭, 블록, 백링크
      body: '[[노트]], [[노트#제목]], [[노트^블록]], ![[임베드]], 그리고 프런트매터에 선언한 별칭이 하나의 색인으로 모입니다. 각 노트는 무엇이 자신을 가리키는지, 자신이 무엇을 가리키는지, 어떤 링크가 아직 목적지가 없는지 보여 줍니다.'
      alt: 노트 오른쪽 사이드바에 백링크와 나가는 링크가 나열되고, 그 아래에 이웃들의 로컬 그래프.
    graph:
      kicker: 형태 보기
      title: 두 번 열어도 같은 자리에 앉는 그래프
      body: 힘 기반 시뮬레이션이 결정적이므로 같은 보관함은 매번 같은 그림을 그립니다. 열 때마다 다시 읽는 대신 배치 자체를 기억할 수 있습니다. 로컬 그래프는 노트 하나와 그 이웃만 보여 줍니다.
      alt: '그래프 뷰: 노드가 된 노트들이 위키링크로 이어지고, 참조가 잦을수록 가까이 모입니다.'
    canvas:
      kicker: 공간에 놓는 노트
      title: 캔버스, 개방형 JSON Canvas 형식으로
      body: 카드와 파일과 선을 무한한 종이 위에 놓고 JSON Canvas 1.0으로 저장합니다. 이 형식의 다른 구현들이 읽고 쓰는 바로 그 파일입니다. 캔버스도 노트만큼 가지고 나갈 수 있습니다.
      alt: 무한 캔버스 위에 노트 카드와 그 연결선이 공간적으로 배치된 모습.
    search:
      kicker: 찾기
      title: 퍼지 전환기, 그리고 연산자를 아는 검색
      body: '한 번의 단축키로 보관함 전체에 대한 퍼지 전환기가 열립니다. 전문 검색은 tag:와 path:를 이해하고, 태그는 본문에서든 프런트매터에서든, 중첩되든, 어떤 문자 체계로든 동작합니다. #프로젝트/진행중은 #project/active와 똑같이 색인됩니다. 만 건 규모의 볼트에서도 기다리지 않습니다. 검색은 메인 스레드 밖에서 실행됩니다.'
      alt: 노트 위에 열린 퀵 스위처가 입력에 따라 보관함을 좁혀 가는 모습.
    sync:
      kicker: 두 번째 기기
      title: iCloud 또는 GitHub, 무엇이 따라갈지는 당신이 정합니다
      body: iCloud로 동기화하거나 보관함을 GitHub 저장소로 푸시합니다. 동기화가 시작된 뒤에는 충돌이 무언가를 덮어쓰는 일은 없습니다. 양쪽에서 바뀐 노트는 다른 쪽 버전이 충돌 사본으로 내 버전 옆에 남습니다. 종류별 필터가 첨부와 미디어의 동행 여부를 정하며, 보관함 자신의 .gitignore는 존중됩니다.
      alt: 'GitHub 동기화 설정: 저장소와 브랜치 선택, 그리고 파일 종류별 동기화 스위치.'
duo:
  title: 'iPhone Duo: 하나의 노트, 네 가지 형태'
  sub: 접으면 익숙한 iPhone 앱입니다. 펼치면 사이드바와 노트가 나란히 놓입니다. 반쯤 펼치면 접힌 선 한쪽에 노트가, 다른 쪽에 백링크·개요·속성이 놓이며, 접힌 선을 가로질러 그려지는 것은 없습니다.
  video_alt: 'iPhone Duo에서의 Inkstone 녹화: 접힌 바깥 화면의 노트 목록, 펼쳐서 사이드바 옆에 놓인 같은 노트, 책처럼 반쯤 펼쳐 오른쪽 페이지의 인스펙터, 세워서 접힌 선 아래의 인스펙터.'
  caption: iPhone Duo 시뮬레이터(iOS 27.2)에서 녹화해 Apple의 iPhone Duo 제품 베젤에 각 장면의 자세대로 담았습니다. 화면은 녹화 그대로입니다(디졸브 외 무편집).
faq:
  title: 자주 묻는 질문
  items:
  - q: AI 지식 베이스란?
    a: 당신의 메모와 파일을 당신과 AI 모두가 찾기 쉽게 정리한 폴더로, AI에게 무엇이 어디 있는지 알려 주는 입구 파일이 있습니다. Inkstone에서는 평범한 폴더 그대로입니다.
  - q: AI 컨텍스트 관리란?
    a: AI 어시스턴트에게 올바른 파일과 그 규칙을 주는 것입니다. AGENTS.md와 SOURCE_OF_TRUTH.md가 어떤 에이전트에게든 그것을 알려 줍니다.
  - q: Obsidian 보관소에서 쓸 수 있나요?
    a: 네. 보관소로 열면 그대로 둡니다. Inkstone이 만들거나 넘겨받은 지식 베이스만 정리됩니다.
  - q: 어떤 기기?
    a: macOS 26의 Mac, iOS 26의 iPhone과 iPad. 기기 내 모델에는 Apple Intelligence 지원 기기가 필요하며, 지원하지 않으면 규칙으로 정리합니다.
  - q: 가격은?
    a: Inkstone은 무료입니다. Mac과 App Store 모두.
specs:
  title: 사양
  sub: 무엇이든 내려받기 전에 알아 둘 만한 것들.
  rows:
  - k: 지식 베이스
    v: 받은 편지함, 프로젝트, 영역, 자료, 미디어, 결과물, 비공개, 검토, 보관 — AGENTS.md, README.md, SOURCE_OF_TRUTH.md를 최신으로 유지
  - k: 정리
    v: 당신의 규칙, 그다음 Apple 기기 내 모델(또는 내 모델, 기본값 꺼짐). 기록, 되돌리기, 삭제 없음
  - k: 플랫폼
    v: macOS 26과 iOS 26, 하나의 SwiftUI 코드베이스. Mac 앱은 유니버설이라 Apple 실리콘과 Intel 모두 지원
  - k: 저장
    v: 직접 고른 폴더의 순수 Markdown 파일. 데이터베이스도 가져오기도 없음
  - k: 호환성
    v: Obsidian 보관함을 양방향으로 그대로 엽니다. 캔버스는 JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown에 더해 위키링크, 임베드, 블록 참조, 콜아웃, 각주, 수식, Mermaid
  - k: 동기화
    v: iCloud 또는 GitHub 저장소, 파일 종류별 필터 지원
  - k: 작업 흐름
    v: Obsidian과 같은 자리표시자의 템플릿, PDF·HTML 내보내기, 명령 팔레트, Spotlight 검색, 단축어 동작
  - k: 인터페이스 언어
    v: English, 简体中文, 繁體中文
  - k: 소스
    v: GitHub에 공개. 라이선스는 아직 정하지 않았습니다.
  - k: 프라이버시
    v: 계정 없음, 텔레메트리 없음, 요청하지 않은 네트워크 호출 없음
  closer: 무료이고, 아무것도 숨기지 않으며, 만들어지는 지식 베이스는 원래 당신의 폴더입니다.
