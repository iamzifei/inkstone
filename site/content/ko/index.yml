title: Inkstone 墨硯 — 노트를 파일 그대로 두는 macOS / iOS 앱
description: 직접 고른 폴더에 놓인 순수 Markdown 파일. 위키링크, 백링크, 그래프, 캔버스, 데일리 노트를 macOS 26과 iOS 26을 위한 네이티브 SwiftUI로. 데이터베이스도, Electron도, 계정도 없습니다.
nav:
  label: 섹션
  skip: 본문으로 건너뛰기
  features: 기능
  typography: 타이포그래피
