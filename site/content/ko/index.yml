title: Inkstone — Mac, iPhone, iPad를 위한 AI 지식 베이스
description: 스스로 정리되는 AI 지식 베이스. 메모, PDF, 사진, 녹음을 폴더에 넣으면 Inkstone이 당신의 규칙과 기기 내 AI로 분류합니다. AGENTS.md 포함. 무료.
