  kofi: Ko-fi에서 후원
hero:
  eyebrow: macOS 26 · iOS 26 · 네이티브 SwiftUI
  title: 노트는 원래 파일입니다. 계속 파일이어야 합니다.
  lede: Inkstone은 당신이 지정한 폴더의 Markdown을 그대로 읽고 씁니다. 이미 가지고 있는 보관함을 그대로 열고, 다른 편집기로 열 수 없는 것은 아무것도 쓰지 않습니다. 앱 자신의 상태는 숨김 폴더에 있고, 언제든 지워도 됩니다.
  note: 무료 · Apple 실리콘 · English · 简体中文 · 繁體中文
  video_alt: 'macOS에서 Inkstone을 녹화한 화면: 보관함을 열고, 한자와 라틴 문자가 섞인 한 줄을 입력하고, 위키링크를 따라가고, 그래프를 여는 과정.'
  video_caption: macOS 26에서 녹화. 구간 사이의 디졸브 외에는 편집하지 않았습니다.
creed:
  title: 세 가지 결정, 나머지는 모두 그 결과
  sub: 모두 구조를 떠받치는 결정입니다. 이 앱이 이렇게 동작하는 이유가 여기 있습니다.
  columns:
  - title: 파일이 곧 사실입니다
    body: 데이터베이스도, 가져오기 단계도, 독자 포맷도 없습니다. Obsidian이 만든 보관함이 여기서 열리고, 여기서 만든 보관함이 저기서 열립니다. Inkstone이 내일 사라져도 당신 손에는 Markdown이 든 폴더가 남습니다.
  - title: 끊어진 링크는 되돌릴 수 없습니다
    body: 고쳐 줄 데이터베이스가 없으므로, 노트의 이름을 바꾸면 그것을 가리키던 모든 위키링크가 같은 동작 안에서 보관함 전체에 걸쳐 다시 쓰입니다. 위 결정의 직접적인 결과이지, 나중에 덧붙인 기능이 아닙니다.
  - title: 엔진은 화면을 모릅니다
    body: 파싱, 색인, 검색, 그래프는 UI 프레임워크를 전혀 import하지 않는 패키지 안에 있습니다. 그래서 시뮬레이터가 아니라 진짜 테스트로 덮여 있고, 같은 엔진이 나중에 명령줄 도구를 떠받칠 수도 있습니다.
features:
  title: 무엇이 들어 있나
  sub: 아래는 모두 구현되어 동작 중입니다. 로드맵이 아닙니다.
  items:
    live_preview:
      kicker: 편집
      title: 분할 화면이 아니라 그 자리에서
      body: 제목, 굵게, 인용, 콜아웃, 체크박스, 표, 코드가 입력하는 대로 제자리에서 그려지고, 문법이 드러나는 것은 커서가 있는 줄뿐입니다. 읽기 모드는 별도의 읽기 전용 화면입니다. 본문 글꼴과 코드 글꼴, 각각의 크기는 따로 설정합니다.
      alt: 'Inkstone 편집기: 제목, 한글·한자·라틴이 섞인 문단, 체크리스트, 인용, 콜아웃, 정렬된 표, 코드 블록이 모두 제자리에서 그려진 모습.'
    links:
      kicker: 연결
      title: 위키링크, 별칭, 블록, 백링크
      body: '[[노트]], [[노트#제목]], [[노트^블록]], ![[임베드]], 그리고 프런트매터에 선언한 별칭이 하나의 색인으로 모입니다. 각 노트는 무엇이 자신을 가리키는지, 자신이 무엇을 가리키는지, 어떤 링크가 아직 목적지가 없는지 보여 줍니다.'
      alt: 노트 오른쪽 사이드바에 백링크와 나가는 링크가 나열되고, 그 아래에 이웃들의 로컬 그래프.
    graph:
      kicker: 형태 보기
      title: 두 번 열어도 같은 자리에 앉는 그래프
      body: 힘 기반 시뮬레이션이 결정적이므로 같은 보관함은 매번 같은 그림을 그립니다. 열 때마다 다시 읽는 대신 배치 자체를 기억할 수 있습니다. 로컬 그래프는 노트 하나와 그 이웃만 보여 줍니다.
      alt: '그래프 뷰: 노드가 된 노트들이 위키링크로 이어지고, 참조가 잦을수록 가까이 모입니다.'
    canvas:
      kicker: 공간에 놓는 노트
      title: 캔버스, 개방형 JSON Canvas 형식으로
      body: 카드와 파일과 선을 무한한 종이 위에 놓고 JSON Canvas 1.0으로 저장합니다. 이 형식의 다른 구현들이 읽고 쓰는 바로 그 파일입니다. 캔버스도 노트만큼 가지고 나갈 수 있습니다.
      alt: 무한 캔버스 위에 노트 카드와 그 연결선이 공간적으로 배치된 모습.
    search:
      kicker: 찾기
      title: 퍼지 전환기, 그리고 연산자를 아는 검색
      body: '한 번의 단축키로 보관함 전체에 대한 퍼지 전환기가 열립니다. 전문 검색은 tag:와 path:를 이해하고, 태그는 본문에서든 프런트매터에서든, 중첩되든, 어떤 문자 체계로든 동작합니다. #프로젝트/진행중은 #project/active와 똑같이 색인됩니다.'
      alt: 노트 위에 열린 퀵 스위처가 입력에 따라 보관함을 좁혀 가는 모습.
    sync:
      kicker: 두 번째 기기
      title: iCloud 또는 GitHub, 무엇이 따라갈지는 당신이 정합니다
      body: iCloud로 동기화하거나 보관함을 GitHub 저장소로 푸시합니다. 충돌은 한 번에 정리되고 사본 두 개로 남지 않습니다. 종류별 필터가 첨부와 미디어의 동행 여부를 정하며, 보관함 자신의 .gitignore는 존중됩니다.
      alt: 'GitHub 동기화 설정: 저장소와 브랜치 선택, 그리고 파일 종류별 동기화 스위치.'
typography:
  title: 한 줄 안의 한자와 라틴 문자
  sub: 어려운 쪽은 한자 문장 안에 들어온 라틴 단어입니다. 거의 모든 앱이 이를 틀리고, 한 번 보고 나면 다시는 못 본 척할 수 없는 방식으로 틀립니다.
  folio: 견본 · Source Serif 4와 본명조
  specimen_title: 한자·라틴 혼식과 4분의 1 글자 폭
  specimen_lead: 한자는 빽빽하게 짜입니다. 낱말 사이 공백이 없으므로 한 줄의 고름 자체가 읽힘이 됩니다. 그 줄에 typography가 끼어들면 두 문자 체계가 부딪칩니다.
  specimen_body: 正文里出现Latin单词时，汉字与拉丁字母之间应当有一段约四分之一字宽的间隙——W3C的中文排版需求称之为文字间隙。这一段文字本身就在演示它：每一处汉字与Latin的交界都由构建时插入的空元素撑开，在支持text-autospace的浏览器上则交还给浏览器处理，两者永远只生效一个。全角标点（，。；：）自带二分空，因此一律不加。
  specimen_quote: 타이포그래피는 내용을 예우하기 위해 존재한다. 그것은 하인이며, 하인의 몸가짐은 눈에 띄지 않아야 한다.
  specimen_cite: Robert Bringhurst, The Elements of Typographic Style
  notes:
  - term: 한 줄의 길이
    def: 본문은 한 줄에 약 66자. Bringhurst가 단단 조판의 이상으로 제시한 폭입니다. 75를 넘으면 눈이 다음 줄의 첫머리를 놓칩니다.
  - term: 하나의 서체 가족
    def: 라틴은 Source Serif 4, 한자는 본명조입니다. 본명조의 라틴 짝이 애초에 Source Serif이므로, 섞인 줄은 한 사람의 세리프이지 두 서체의 다툼이 아닙니다.
  - term: 색은 의미입니다
    def: 주사 붉은색 하나 — 인장을 종이에 찍었을 때의 그 붉은색 — 만이 링크와 태그와 현재 동작을 표시합니다. 그 밖에 색을 가진 것은 없습니다.
  - term: 움직임은 문장 부호입니다
    def: 요소는 나타날 때 8픽셀 올라오고, 그 밖에는 아무것도 움직이지 않습니다. '동작 줄이기'를 켜 두었다면 그마저도 한 번도 일어나지 않습니다.
specs:
  title: 사양
  sub: 무엇이든 내려받기 전에 알아 둘 만한 것들.
  rows:
  - k: 플랫폼
    v: macOS 26과 iOS 26, 하나의 SwiftUI 코드베이스, Apple 실리콘
  - k: 저장
    v: 직접 고른 폴더의 순수 Markdown 파일. 데이터베이스도 가져오기도 없음
  - k: 호환성
    v: Obsidian 보관함을 양방향으로 그대로 엽니다. 캔버스는 JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown에 더해 위키링크, 임베드, 블록 참조, 콜아웃, 각주, 수식, Mermaid
  - k: 동기화
    v: iCloud 또는 GitHub 저장소, 파일 종류별 필터 지원
  - k: 인터페이스 언어
    v: English, 简体中文, 繁體中文
  - k: 소스
    v: GitHub에 공개. 라이선스는 아직 정하지 않았습니다.
  - k: 프라이버시
    v: 계정 없음, 텔레메트리 없음, 요청하지 않은 네트워크 호출 없음
  closer: 무료이고, 아무것도 붙잡아 두지 않으며, 만들어 내는 파일은 당신이 이미 가지고 있던 그 파일입니다.
