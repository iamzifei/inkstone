title: 스스로 정리되는 AI 지식 베이스 — Inkstone (Mac, iPhone, iPad)
description: 평범한 폴더에 개인 AI 지식 베이스를 만드세요. 메모, PDF, 사진, 녹음을 넣으면 Inkstone이 당신의 규칙과 기기 내 모델로 분류하고, AI 어시스턴트를 위한 AGENTS.md를 씁니다. 무료.
crumb: AI 지식 베이스
h1: 스스로 정리되는 AI 지식 베이스
lede: 메모, PDF, 사진, 녹음을 한 폴더에 넣으세요. Inkstone이 쉬운 말로 쓴 규칙과 Apple의 기기 내 모델로 하나씩 분류하고, 어떤 AI 어시스턴트도 읽을 수 있는 폴더로 유지합니다.
hero_shot: mac-k1-plan
hero_alt: 'Mac의 Inkstone: 넣은 파일 5개의 정리 계획.'
sections:
- h2: AI 지식 베이스란?
  paras:
  - 당신의 메모와 파일을 당신과 AI 어시스턴트 모두가 찾기 쉽게 정리하고, 무엇이 어디 있는지와 어떤 파일을 믿어야 하는지를 글로 적어 둔 것입니다. 평범한 메모 폴더와의 차이는 바로 이 뒷부분입니다. AI는 청구서가 어디 있냐고 물어볼 수 없으니까요.
  - Inkstone에서는 Markdown과 파일이 담긴 평범한 폴더 그대로입니다. 데이터베이스에 갇히지 않으며, 어떤 앱과 AI 에이전트든 읽을 수 있습니다.
- h2: Inkstone이 만드는 방법
  list:
  - '사람과 AI 모두를 위한 구조: 받은 편지함, 프로젝트, 영역, 자료, 미디어, 결과물, 비공개 — 그리고 애매한 것을 위한 검토 폴더와 중복 파일이 기다리는 보관 폴더.'
  - '먼저 규칙: 당신의 규칙, 그다음 개인 정보(신분증, 은행, 의료는 비공개 폴더로), 그다음 파일이 언급한 프로젝트, 미디어는 종류와 월별로.'
  - 나머지는 기기 내 모델이. 파일 앞부분을 읽고 폴더와 이름을 제안하며, 확신이 없으면 파일은 당신을 기다립니다.
  - '한눈에 보이는 이름: 20261119-리모델링-견적.md — 날짜, 그다음 주제.'
  - 'AI를 위한 입구 파일: AGENTS.md, README.md, SOURCE_OF_TRUTH.md. 폴더가 바뀔 때마다 다시 씁니다.'
  shot: mac-k2-organized
  alt: 정리 후의 지식 베이스와 '되돌리기' 배너.
- h2: 안심하고 맡길 수 있습니다
  paras:
  - 아무것도 삭제하지 않습니다. 모든 이동은 실행 전에 기록되고, 한 번의 정리를 바이트 단위로 되돌릴 수 있습니다. 메모 본문은 바꾸지 않습니다. 큰 정리와 중복은 당신의 승인을 기다립니다.
- h2: iPhone과 iPad에서도
  paras:
  - 파일 앱에서 추가하면 받은 편지함에 들어가 같은 방식으로 분류됩니다. 지식 베이스는 iCloud Drive에 있어 Mac과 iPhone이 같은 폴더를 봅니다.
  shot: iphone-k4-drop
  alt: 'iPhone: 복사할까요, 이동할까요?'
faq:
  title: 자주 묻는 질문
  items:
  - q: AI가 내 파일을 모두 읽나요?
    a: 기기 내 모델은 규칙으로 분류하지 못한 파일의 앞부분만, 당신의 기기에서 읽습니다. 클라우드 모델은 내 키를 넣고 켰을 때만 쓰이며, 비공개로 보이는 파일은 보내지 않습니다.
  - q: Obsidian과 함께 쓸 수 있나요?
    a: Obsidian 보관소는 그대로 열리며 다시 정리되지 않습니다. Inkstone이 만든 지식 베이스는 평범한 Markdown이라 Obsidian에서도 열립니다.
  - q: 어떤 기기?
    a: Mac(macOS 26), iPhone과 iPad(iOS 26). 기기 내 모델에는 Apple Intelligence 지원 기기가 필요하며, 지원하지 않으면 규칙으로 정리합니다.
  - q: 가격은?
    a: 무료입니다. Mac과 App Store 모두, 계정 없이.
