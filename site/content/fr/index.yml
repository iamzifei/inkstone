title: Inkstone — une application de notes Markdown pour macOS et iOS
description: De simples fichiers Markdown sur votre propre disque. Wikiliens, rétroliens, graphe, canevas et notes du jour, dans une application native pour macOS 26 et iOS 26. Sans base de données, sans Electron, sans compte.
