hero:
  eyebrow: Base de connaissances IA · Mac · iPhone · iPad
  title: Glissez n'importe quoi. Ça se range tout seul.
  lede: 'Inkstone fait d''un dossier une base de connaissances IA. Notes, PDF, photos, enregistrements : chaque fichier est classé selon des règles que vous pouvez lire et modifier, avec une IA qui tourne sur votre appareil. Rien n''est jamais supprimé, et chaque passe peut être annulée.'
  note: Gratuit · Sans compte · English · 简体中文 · 繁體中文
  mac_alt: 'Inkstone sur Mac : avant de classer cinq fichiers glissés, il montre le plan — classés, privés, doublons mis de côté — et attend « Organize ».'
  phone_alt: Le même plan sur iPhone.
how:
  title: Une base de connaissances en trois étapes
  sub: Rien à configurer. Un nom, un emplacement, et de quoi y glisser.
  steps:
  - title: Nommez-la, choisissez où elle vit
    body: iCloud Drive, n'importe quel dossier, ou un dossier que vous avez déjà. Inkstone crée les dossiers — boîte de réception, projets, domaines, ressources, médias, productions, privé — et écrit les règles de rangement.
  - title: Glissez n'importe quoi
    body: Glissez des fichiers sur la fenêtre ou ajoutez-les depuis l'app Fichiers. La première fois, copier ou déplacer — copier par défaut.
  - title: C'est classé pour vous
    body: Ce qui semble privé va d'abord dans le dossier privé, puis vos règles, puis le modèle sur l'appareil. Renommé par date et sujet. Ce qui est incertain attend dans un dossier à vérifier.
  alts:
  - 'Étape 1 : créer votre base de connaissances IA'
  - 'Étape 2 : copier ou déplacer ?'
  - 'Étape 3 : le plan — classés, privés, doublons mis de côté'
safe:
  title: Rien ne se perd. Jamais.
  points:
  - Rien n'est jamais supprimé. Les doublons vont dans un dossier à supprimer, que vous videz vous-même.
  - Chaque déplacement est noté avant d'être fait — un tableau Markdown lisible.
  - Annuler remet toute une passe en place, sans écraser ce que vous avez modifié depuis.
  - Plus de 20 fichiers, ou des doublons ? Vous voyez d'abord tout le plan, et rien ne bouge sans votre accord.
  - 'Le texte d''une note n''est jamais réécrit : seules des propriétés comme sa source et sa date sont ajoutées en tête.'
  alt: 'La base de connaissances après une passe : ses dossiers dans la barre latérale et un bandeau — 5 fichiers rangés, Annuler.'
ai:
  kicker: Gestion du contexte IA
  title: Prête pour l'IA, dès le premier fichier
  body: 'Chaque base de connaissances porte trois fichiers d''entrée, écrits et tenus à jour par Inkstone. Confiez le dossier à n''importe quel assistant ou agent IA : il sait ce que c''est, où se trouvent les choses et à quel fichier se fier.'
  files:
  - name: AGENTS.md
    desc: ce que c'est, et les règles qu'un agent suit ici
  - name: README.md
    desc: la carte des dossiers, pour les humains et les machines
  - name: SOURCE_OF_TRUTH.md
    desc: quel fichier fait foi pour quoi
  foot: Seule la partie entre les marqueurs d'Inkstone est réécrite. Ce que vous ajoutez autour reste.
  alt: AGENTS.md ouvert dans Inkstone sur Mac.
rules:
  title: Vos règles, en mots simples
  body: Les règles de rangement sont un fichier de votre base de connaissances. Modifiez-les dans les Réglages comme une note — une ligne par règle. Elles passent juste après le contrôle de confidentialité, avant tout le reste.
  example: '## My rules


    - Factures → 20-Areas/Finance/Invoices

    - Travaux → 10-Projects/Renovation'
  foot: En dessous se trouve la politique par défaut, dans les mêmes mots simples — modifiable, ou rétablie d'un clic.
  alt: Réglages › Base de connaissances sur Mac.
private:
  title: Privée par conception
  cols:
  - title: L'IA sur votre appareil
    body: Le modèle d'Apple sur l'appareil décide où va un fichier, sur les appareils compatibles. Rien ne quitte l'appareil.
  - title: Ou votre propre modèle
    body: Désactivé par défaut. Avec votre propre clé, sont envoyés le nom et le début d'un fichier que les règles ne savent pas placer, avec vos noms de dossiers et vos règles — jamais un fichier qui semble privé.
  - title: Juste des fichiers
    body: Pas de compte, pas de mesure d'audience, pas de serveur à nous. Votre base de connaissances est un dossier de fichiers ordinaires.
features:
  title: Un éditeur Markdown complet, aussi
  sub: Tout reste du Markdown simple. Un coffre d'une autre app Markdown s'ouvre tel quel — et n'est jamais réorganisé.
  items:
    live_preview:
      kicker: Écrire
      title: Aperçu vivant, pas un écran scindé
      body: 'Titres, gras, citations, encadrés, cases à cocher, tableaux et code se composent à mesure que vous tapez ; la syntaxe ne se montre que sur la ligne où se trouve le curseur. Le mode lecture est une vue distincte, en lecture seule. Police du texte, police du code et leurs corps se règlent séparément. En mode lecture, les caractères de syntaxe sont supprimés et non masqués : un paragraphe copié ne contient que le texte.'
      alt: 'L’éditeur d’Inkstone en aperçu vivant : un titre, un paragraphe mêlant chinois et latin, une liste de tâches, une citation, un encadré, un tableau aligné et un bloc de code.'
    links:
      kicker: Relier
      title: Wikiliens, alias, blocs, rétroliens
      body: '[[Note]], [[Note#Titre]], [[Note^bloc]], ![[Inclusions]] et les alias déclarés dans l’en-tête se résolvent tous dans un même index. Chaque note montre ce qui pointe vers elle, ce vers quoi elle pointe, et lesquels de ses liens n’ont pas encore de destination.'
      alt: Une note dont les rétroliens et les liens sortants figurent dans la barre latérale droite, au-dessus d’un petit graphe local des voisines.
    graph:
      kicker: Voir la forme
      title: Un graphe qui retombe deux fois au même endroit
      body: 'La simulation de forces est déterministe : un même coffre dessine chaque fois la même image. On peut apprendre sa disposition au lieu de la relire à chaque ouverture. Le graphe local ne montre qu’une note et ses voisines.'
      alt: 'La vue en graphe : les notes en nœuds, reliées par leurs wikiliens et regroupées selon la densité de leurs renvois.'
    canvas:
      kicker: Notes dans l’espace
      title: Canevas, au format ouvert JSON Canvas
      body: Des cartes, des fichiers et des liens sur une feuille infinie, enregistrés en JSON Canvas 1.0 — le fichier même que lisent et écrivent les autres implémentations du format. Vos canevas sont aussi portables que vos notes.
      alt: Un canevas où des cartes de notes et leurs connexions sont disposées spatialement sur une feuille infinie.
    search:
      kicker: Retrouver
      title: Sélecteur flou, et recherche à opérateurs
      body: 'Une frappe ouvre un sélecteur flou sur toutes les notes. La recherche plein texte comprend tag: et path:, et les étiquettes fonctionnent dans le corps comme dans l’en-tête, imbriquées, dans n’importe quelle écriture : #项目/进行中 s’indexe exactement comme #project/active. Rien ne fait attendre, même sur un coffre de dix mille notes : la recherche tourne hors du fil principal.'
      alt: Le sélecteur rapide ouvert par-dessus une note, filtrant le coffre au fil des caractères saisis.
    sync:
      kicker: Deux machines
      title: iCloud ou GitHub, et c’est vous qui décidez ce qui voyage
      body: 'Synchronisez par iCloud, ou poussez le coffre vers un dépôt GitHub. Une fois le coffre synchronisé, un conflit n’écrase jamais rien : si les deux côtés ont modifié une note, l’autre version est gardée à côté de la vôtre comme copie de conflit. Des filtres par type de fichier décident si les pièces jointes et les médias suivent, et le .gitignore du coffre est respecté.'
      alt: 'Les réglages de synchronisation GitHub : choix du dépôt et de la branche, et interrupteurs par type de fichier.'
duo:
  title: 'iPhone Duo : une note, quatre formes'
  sub: Fermé, c’est l’app iPhone. Ouvert, la barre latérale et la note côte à côte. Entrouvert, la note occupe un côté du pli, ses rétroliens, son plan et ses propriétés l’autre — rien n’est dessiné à cheval sur le pli.
  video_alt: 'Un enregistrement d’Inkstone sur iPhone Duo : la liste des notes sur l’écran extérieur, fermé ; la même note, ouvert, à côté de la barre latérale ; puis entrouvert comme un livre, l’inspecteur en page de droite ; puis à la verticale, l’inspecteur sous le pli.'
  caption: Enregistré dans le simulateur iPhone Duo, iOS 27.2, et présenté dans les cadres produit iPhone Duo d’Apple, dans la position de chaque prise ; l’écran est l’enregistrement, non monté hormis les fondus.
faq:
  title: Questions
  items:
  - q: Qu'est-ce qu'une base de connaissances IA ?
    a: Un dossier de vos notes et fichiers, rangé pour que vous et une IA y trouviez les choses — avec des fichiers d'entrée qui disent à l'IA où est quoi. Dans Inkstone, il reste un dossier ordinaire.
  - q: Qu'est-ce que la gestion du contexte IA ?
    a: Donner à un assistant IA les bons fichiers et leurs règles. AGENTS.md et SOURCE_OF_TRUTH.md le font pour n'importe quel agent.
  - q: Est-ce compatible avec mon coffre Obsidian ?
    a: Oui. Ouvert comme coffre, il reste tel quel. Le rangement ne se fait que dans une base de connaissances créée ou adoptée par Inkstone.
  - q: Quels appareils ?
    a: Mac sous macOS 26, iPhone et iPad sous iOS 26. Le modèle sur l'appareil demande Apple Intelligence ; sans lui, le rangement suit vos règles.
  - q: Combien ça coûte ?
    a: Inkstone est gratuit, sur Mac et sur l'App Store.
specs:
  title: Caractéristiques
  sub: Ce qu’il vaut la peine de savoir avant de télécharger quoi que ce soit.
  rows:
  - k: Base de connaissances
    v: Boîte de réception, projets, domaines, ressources, médias, productions, privé, à vérifier, archives — avec AGENTS.md, README.md et SOURCE_OF_TRUTH.md à jour
  - k: Rangement
    v: D'abord la confidentialité, puis vos règles, puis le modèle d'Apple sur l'appareil (ou le vôtre, désactivé par défaut). Journalisé, réversible, rien supprimé
  - k: Plateformes
    v: 'macOS 26 et iOS 26, une seule base de code SwiftUI. L’app Mac est universelle : Apple silicon et Intel'
  - k: Stockage
    v: Des fichiers Markdown ordinaires dans un dossier que vous choisissez. Ni base de données ni importation
  - k: Compatibilité
    v: Les coffres Obsidian s’ouvrent tels quels, dans les deux sens. Le canevas est en JSON Canvas 1.0
  - k: Markdown
    v: GitHub Flavored Markdown, plus wikiliens, inclusions, références de bloc, encadrés, notes de bas de page, mathématiques et Mermaid
  - k: Synchronisation
    v: iCloud ou un dépôt GitHub, avec filtres par type de fichier
  - k: Flux de travail
    v: Modèles avec les variables d’Obsidian, export en PDF ou HTML, palette de commandes, notes dans Spotlight, actions Raccourcis
  - k: Langues de l’interface
    v: English, 简体中文, 繁體中文
  - k: Code source
    v: Public sur GitHub. Aucune licence n’a encore été choisie.
  - k: Confidentialité
    v: Aucun compte, aucune télémétrie, aucun appel réseau que vous n’ayez demandé
  closer: C'est gratuit, ça ne vous cache rien, et la base de connaissances créée est un dossier qui vous appartient déjà.
