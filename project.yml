name: Inkstone
options:
  bundleIdPrefix: com.orris
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  InkstoneCore:
    path: Packages/InkstoneCore
  # LaTeX maths typesetting. Pure Swift with its own bundled maths fonts, so no
  # JavaScript engine and no WebView — MathJax/KaTeX would mean embedding a whole
  # browser to render `$x^2$` in a note. MIT licensed.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    from: "1.7.3"
  # In-app updates. macOS only — Sparkle's Package.swift declares no iOS
  # platform, so the dependency below carries a destination filter. Without it
  # the iOS build fails to resolve the package rather than simply skipping it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: K9YT36SP4B
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Inkstone:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
    dependencies:
      - package: InkstoneCore
      - package: SwiftMath
      - package: Sparkle
        destinationFilters: [macOS]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Inkstone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        UILaunchScreen: {}
        # Documents the app can open. `.md` is a public type; `.canvas` is
        # declared below so the JSON Canvas format is a first-class citizen.
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSHumanReadableCopyright: ""
        # The app uses HTTPS and the Keychain and nothing else, which is exempt
        # encryption. Declaring it here stops App Store Connect asking the same
        # question on every single upload — and the answer never changes.
        ITSAppUsesNonExemptEncryption: false
        # Required, and not optional once the app ships for iPad: App Store
        # upload rejects a bundle with no orientations (error 90474) because
        # iPad multitasking needs all four. iPhone keeps upside-down off, which
        # is the platform convention for a non-utility app.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Background sync on iOS. `fetch` is what BGAppRefreshTask needs and
        # `processing` is what BGProcessingTask needs; both identifiers must also
        # be listed below or `BGTaskScheduler.submit` throws `notPermitted`.
        # Harmless on macOS, where the app is never suspended and the foreground
        # timer in Workspace is sufficient.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.orris.inkstone.sync.refresh
          - com.orris.inkstone.sync.processing
          # Wildcard, per the BGContinuedProcessingTaskRequest header: registered
          # once in this form, submitted with a unique suffix per sync.
          - com.orris.inkstone.sync.continued.*
        # Sparkle. The feed is served from the site rather than from
        # raw.githubusercontent.com/.../main like the sibling apps: main is not
        # this repository's trunk (see docs/plans/2026-08-20-website-and-domain.md),
        # and an update feed should not depend on which branch is currently sane.
        # inkslab.app is ours, is HTTPS, and is generated from site/.
        SUFeedURL: https://inkslab.app/appcast.xml
        # The public half of the EdDSA key in the login keychain, shared with
        # AudioSwitch, Candela and ClipStack — it is the developer's signing
        # identity, not a per-app secret. Sparkle checks every download against it.
        SUPublicEDKey: CHSkSUupddRglHt3C2quzHtit8LMB29BMI44/O9aItg=
        # Required because this app is sandboxed: installation happens in an XPC
        # service outside the sandbox. See App/Support/Updater.swift.
        SUEnableInstallerLauncherService: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: md.obsidian.canvas
            UTTypeDescription: JSON Canvas
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [canvas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orris.inkstone
        # Ship all three UI languages; the in-app picker overrides the system
        # language by swapping the SwiftUI locale.
        SWIFT_EMIT_LOC_STRINGS: YES
        PRODUCT_NAME: Inkstone
        GENERATE_INFOPLIST_FILE: NO
        # One target, two platforms, two entitlement files. The macOS one carries
        # App Sandbox keys and Sparkle's temporary-exception mach-lookup, neither
        # of which belongs on iOS — and the latter is rejected outright by App
        # Store validation. The bracketed condition is how a single target picks
        # per-SDK.
        CODE_SIGN_ENTITLEMENTS: App/Resources/Inkstone.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Resources/Inkstone-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Resources/Inkstone-iOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # A framework sits at Contents/Frameworks on macOS and at
        # Contents/Frameworks *relative to the executable* on iOS, and the
        # executable is one level deeper on macOS. One target for both platforms
        # gets only the iOS runpath by default, so a macOS build links fine,
        # signs fine, notarises fine — and then dyld cannot find Sparkle and the
        # app dies at launch with "Library missing". None of the packaging checks
        # catch it, because none of them run the app.
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": $(inherited) @executable_path/../Frameworks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
