# App checks on every push and pull request: the InkstoneCore test suite
# (unit, e2e against a fake GitHub, regressions) and debug builds of the app for
# macOS and the iOS simulator. Before this, CI built only the website.
name: App

on:
  push:
    branches: ["**"]
    paths-ignore: ["site/**", "docs/**", "*.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "*.md"]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: InkstoneCore tests
        working-directory: Packages/InkstoneCore
        run: swift test

  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - destination: "platform=macOS"
            runner: macos-26
          # Xcode 27 (GitHub's preview image): its iOS SDK has the iPhone Duo
          # APIs (iOS 27.1+). On macos-26 (Xcode 26.6) that code is compiled
          # out, so CI would never build the Duo path.
          - destination: "generic/platform=iOS Simulator"
            runner: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Inkstone.xcodeproj -scheme Inkstone -configuration Debug \
            -destination '${{ matrix.destination }}' CODE_SIGNING_ALLOWED=NO build | tail -20
          test ${PIPESTATUS[0]} -eq 0
      # Release compiles out everything under `#if DEBUG`, so code that only
      # builds with it (a declaration left outside the block, an import inside
      # it) passes the Debug build and breaks the shipping one. Caught by hand
      # packaging 0.5.1; checked here so it is caught on the PR.
      - name: Build (Release)
        run: |
          xcodebuild -project Inkstone.xcodeproj -scheme Inkstone -configuration Release \
            -destination '${{ matrix.destination }}' CODE_SIGNING_ALLOWED=NO build | tail -20
          test ${PIPESTATUS[0]} -eq 0
